<!doctype html>
<html lang="es-MX" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitoreo de Sigatoka negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF; --surface:#F1F5EF; --surface-2:#E2E9DE; --line:#C3CEBF;
  --ink:#0E2015; --ink-2:#46574B; --leaf:#1B6A38; --leaf-hover:#145A2E; --on-leaf:#FFFFFF;
  --banana:#F4C430; --aviso-bg:#FFF2C7; --aviso:#6E4500; --error-bg:#FCE3DF; --error:#9E2017; --info-bg:#E4EFF7; --info:#1D4E73;
  --g0:#3E9B4F; --g1:#A9D153; --g2:#EAD53D; --g3:#F3A43B; --g4:#DC6430; --g5:#A13A22; --g6:#45281A;
  --verde:#2E8B47; --amarillo:#E1B10C; --rojo:#C5352A; --sin:#BAC4B7;
  --s1:#1B6A38; --s2:#2B6CB0; --s3:#C05621; --s4:#7B3FA0; --s5:#0F8A8A; --s6:#B7791F; --s7:#C53070; --s8:#4A5568;
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1510; --surface:#16211A; --surface-2:#203026; --line:#33453A;
    --ink:#E9F2EB; --ink-2:#A7BAAD; --leaf:#5DBE79; --leaf-hover:#72CC8B; --on-leaf:#08130C;
    --aviso-bg:#3A2E0B; --aviso:#F6D77A; --error-bg:#3D1512; --error:#FFA79E; --info-bg:#132B3D; --info:#9CCBEE;
    --sin:#4B5A50; --s1:#5DBE79; --s2:#6FA8E8; --s3:#F08A4B; --s4:#B98AE0; --s5:#4FD1C5; --s6:#E9B949; --s7:#F07BAE; --s8:#A0AEC0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1510; --surface:#16211A; --surface-2:#203026; --line:#33453A;
  --ink:#E9F2EB; --ink-2:#A7BAAD; --leaf:#5DBE79; --leaf-hover:#72CC8B; --on-leaf:#08130C;
  --aviso-bg:#3A2E0B; --aviso:#F6D77A; --error-bg:#3D1512; --error:#FFA79E; --info-bg:#132B3D; --info:#9CCBEE;
  --sin:#4B5A50; --s1:#5DBE79; --s2:#6FA8E8; --s3:#F08A4B; --s4:#B98AE0; --s5:#4FD1C5; --s6:#E9B949; --s7:#F07BAE; --s8:#A0AEC0;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.06rem}
p{margin:.4em 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--banana);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.peq{font-size:.86rem}

/* barra superior */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;margin-right:auto;min-width:0}
.marca-hoja{width:26px;height:26px;border-radius:0 100% 0 100%;background:linear-gradient(135deg,var(--g0) 0 45%,var(--g3) 45% 70%,var(--g6) 70%);flex:none}
.sel-usuario{min-height:44px;border:2px solid var(--line);border-radius:10px;background:var(--bg);padding:4px 8px;max-width:220px}
@media (max-width:560px){.marca .txt{display:none}.sel-usuario{max-width:42vw}.barra{flex-wrap:nowrap;gap:6px;padding:8px 10px}.pill{padding:4px 10px}.btn-tema{width:44px;padding:0;justify-content:center}}
.pill{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-height:44px;padding:4px 12px;border-radius:999px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;font-size:.9rem}
.punto{width:12px;height:12px;border-radius:50%;flex:none}
.pop{position:absolute;right:12px;top:100%;margin-top:6px;background:var(--bg);border:2px solid var(--ink);border-radius:14px;padding:14px;width:min(340px,calc(100vw - 24px));box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:40}

/* navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;min-height:60px;border:0;background:none;font-weight:700;font-size:.9rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--ink-2);border-top:4px solid transparent}
.nav button.activo{color:var(--ink);border-top-color:var(--leaf)}
.nav svg{width:24px;height:24px}
.contenido{padding:16px 14px 110px;max-width:760px;margin:0 auto}
.contenido.ancho{max-width:1240px}

/* botones */
.btn{min-height:52px;padding:10px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--bg);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.btn-p:hover:not(:disabled){background:var(--leaf-hover)}
.btn-x{border-color:var(--error);color:var(--error)}
.btn-xp{background:var(--error);border-color:var(--error);color:var(--bg)}
.btn-q{border-color:var(--line)}
.btn-b{display:flex;width:100%}
.btn-s{min-height:44px;padding:6px 12px;font-size:.92rem}
.enlace{background:none;border:0;color:var(--leaf);font-weight:700;cursor:pointer;padding:8px 0;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.fila-btn{display:flex;gap:10px;flex-wrap:wrap}
.fila-btn>.btn{flex:1 1 160px}

/* bloques */
.seccion{margin:18px 0}
.caja{background:var(--surface);border-radius:14px;padding:14px}
.caja-borde{border:2px solid var(--line);border-radius:14px;padding:14px}
.lista{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid transparent;border-radius:14px;padding:12px 14px;min-height:64px;cursor:pointer}
.item:hover{border-color:var(--line)}
.item .der{margin-left:auto;text-align:right}
.etq{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;border:2px solid currentColor;white-space:nowrap}
.e-curso{color:var(--info)} .e-cerrado{color:var(--aviso)} .e-sinc{color:var(--verde)}
.aviso{background:var(--aviso-bg);color:var(--aviso);border-radius:12px;padding:10px 14px;margin:10px 0}
.error{background:var(--error-bg);color:var(--error);border-radius:12px;padding:10px 14px;margin:10px 0}
.info{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 14px;margin:10px 0}
.aviso ul,.error ul{margin:0;padding-left:20px}
.migas{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.volver{min-height:44px;border:0;background:none;font-weight:700;cursor:pointer;padding:0 8px 0 0;display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kpi{background:var(--surface);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:1.6rem;line-height:1.1}
.kpi span{font-size:.82rem;color:var(--ink-2)}

/* formularios */
label.campo{display:block;margin:12px 0}
label.campo>span{display:block;font-weight:700;margin-bottom:6px}
.inp{width:100%;min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 12px}
.inp:focus{border-color:var(--leaf)}
textarea.inp{min-height:84px;resize:vertical}
.rejilla2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:420px){.rejilla2{grid-template-columns:1fr}}

/* stepper */
.paso{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.paso .tit{font-weight:700}
.paso .sub{font-size:.82rem;color:var(--ink-2)}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:56px;height:56px;border-radius:12px;border:2px solid var(--ink);background:var(--bg);font-size:1.6rem;font-weight:700;cursor:pointer;line-height:1}
.stepper output{min-width:54px;text-align:center;font-size:1.7rem;font-weight:700}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:52px;min-height:52px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer;font-size:1.05rem}
.chip.activo{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.np.activo{background:var(--ink-2);border-color:var(--ink-2)}
.chip-tabla{min-width:84px}
.sintoma{padding:12px 0;border-bottom:1px solid var(--line)}
.sintoma .cab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}

/* hojas */
.tira{display:flex;gap:4px;flex-wrap:wrap}
.cuad{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;border:1px solid rgba(0,0,0,.15)}
.cuad.vacio{background:var(--bg);border:2px dashed var(--line);color:var(--ink-2)}
.gc0{background:var(--g0);color:#fff}.gc1{background:var(--g1);color:#13210f}.gc2{background:var(--g2);color:#2a2306}
.gc3{background:var(--g3);color:#2d1a03}.gc4{background:var(--g4);color:#fff}.gc5{background:var(--g5);color:#fff}.gc6{background:var(--g6);color:#fff}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.modal-cab{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:2px solid var(--ink)}
.modal-cuerpo{flex:1;overflow:auto;padding:12px 14px}
.modal-pie{border-top:2px solid var(--ink);padding:10px 12px;background:var(--bg)}
.velo{position:fixed;inset:0;z-index:55;background:rgba(10,20,14,.55);display:flex;align-items:flex-end;justify-content:center}
.hoja-sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.velo{align-items:center}.hoja-sheet{border-radius:18px}}

/* planta dibujada */
.planta{display:flex;flex-direction:column;gap:3px;align-items:center;padding:4px 0 10px;position:relative}
.planta::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:10px;margin-left:-5px;background:var(--surface-2);border-radius:5px}
.hoja-f{position:relative;display:flex;align-items:center;width:100%;max-width:340px;cursor:pointer;background:none;border:0;padding:0;min-height:30px}
.hoja-f .lam{width:44%;height:26px;border:2px solid transparent}
.hoja-f.izq{justify-content:flex-start}.hoja-f.izq .lam{margin-left:6%;border-radius:100% 0 100% 0}
.hoja-f.der{justify-content:flex-end}.hoja-f.der .lam{margin-right:6%;border-radius:0 100% 0 100%}
.hoja-f .n{position:absolute;left:50%;transform:translateX(-50%);font-size:.78rem;font-weight:700;background:var(--bg);border:2px solid var(--ink);border-radius:999px;min-width:28px;height:24px;display:flex;align-items:center;justify-content:center;z-index:1}
.hoja-f.actual .lam{border-color:var(--ink);box-shadow:0 0 0 3px var(--banana)}
.hoja-f.actual .n{background:var(--banana);color:#111}
.lam.vacia{background:repeating-linear-gradient(45deg,var(--surface) 0 6px,var(--surface-2) 6px 12px)}
.grados{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grado{min-height:78px;border-radius:14px;border:2px solid rgba(0,0,0,.25);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;font-weight:700}
.grado b{font-size:2rem;line-height:1}
.grado small{font-size:.74rem;font-weight:700;line-height:1.15;text-align:center}
.grado.sel{outline:4px solid var(--ink);outline-offset:2px}
.sep-func{grid-column:1/-1;font-size:.78rem;color:var(--ink-2);display:flex;justify-content:space-between}

/* tablero */
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filtros label{display:flex;flex-direction:column;font-size:.85rem;font-weight:700;gap:4px}
.filtros .inp{min-height:46px;width:auto}
.rej-tab{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c12{grid-column:span 12}.c7{grid-column:span 7}.c5{grid-column:span 5}.c6{grid-column:span 6}
@media (max-width:980px){.c7,.c5,.c6{grid-column:span 12}}
.panel{border:2px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.panel-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.panel-cab h2{margin-right:auto}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{min-height:42px;padding:4px 12px;border:0;background:var(--bg);font-weight:700;cursor:pointer;font-size:.88rem}
.seg button.activo{background:var(--ink);color:var(--bg)}
.desliza{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.datos{border-collapse:collapse;width:100%;font-size:.92rem}
table.datos th,table.datos td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.datos th{font-size:.8rem;color:var(--ink-2)}
table.datos td.n,table.datos th.n{text-align:right;font-variant-numeric:tabular-nums}
table.datos tr.clic{cursor:pointer}
table.datos tr.clic:hover td{background:var(--surface)}
.sem{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle}
.respuestas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.resp{background:var(--surface);border-radius:14px;padding:12px 14px;border-left:6px solid var(--ink)}
.resp h3{font-size:.95rem;margin-bottom:4px}
.resp p{font-size:.92rem;margin:.2em 0}
.lectura{background:var(--surface);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.9rem}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin:6px 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.barra-h{display:grid;grid-template-columns:72px 1fr 64px;gap:8px;align-items:center;margin:5px 0;font-size:.9rem}
.barra-h .fondo{background:var(--surface);border-radius:6px;height:24px;overflow:hidden}
.barra-h .val{height:100%;border-radius:6px}
.apilada{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--surface)}
.mapa svg{width:100%;height:auto;display:block;max-height:440px}
.mapa polygon{cursor:pointer;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.mapa polygon.sel{stroke-width:4}
.mapa text{font-weight:700;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.vacio-panel{padding:24px 10px;text-align:center;color:var(--ink-2)}
.tabla-admin input,.tabla-admin select{min-height:44px;border:2px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--bg);width:100%}
.interruptor{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:700}
.interruptor input{width:24px;height:24px;accent-color:var(--leaf)}
.bienvenida{max-width:640px;margin:0 auto;padding:28px 18px 60px}
.bienvenida h1{font-size:2rem;margin:14px 0 6px}
.cargando{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:80;font-weight:700;max-width:90vw}
.pie-fijo{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--bg);border-top:2px solid var(--line);padding:10px 14px}
.pie-fijo>div{max-width:760px;margin:0 auto;display:flex;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"><div class="cargando">Cargando…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* =====================================================================
   CAPA 1 — MODELO DE DATOS (sin UI)
   Cada colección se mapea a una tabla de PostgreSQL. Las plantas y hojas
   viajan anidadas en su EvaluacionTabla (un documento por tabla evaluada),
   pero cada una conserva su propio id y llave foránea para aplanarse
   directo a las tablas Planta y Hoja.
   Convención: hmj_* = número de hoja; 0 = "no presenta"; null = sin capturar.
   ===================================================================== */
const Modelo = (() => {
  const uuid = () => (crypto && crypto.randomUUID) ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
  const ahora = () => new Date().toISOString();
  const pad = n => String(n).padStart(2, '0');
  const fechaStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const hoy = () => fechaStr(new Date());
  const ymd = s => { const [y, m, d] = s.split('-').map(Number); return [y, m - 1, d]; };
  const sumarDias = (s, n) => { const [y, m, d] = ymd(s); const t = new Date(Date.UTC(y, m, d + n)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`; };
  const diasEntre = (a, b) => Math.round((Date.UTC(...ymd(b)) - Date.UTC(...ymd(a))) / 864e5);
  function semanaISO(s) {
    const [y, m, d] = ymd(s);
    const dt = new Date(Date.UTC(y, m, d));
    const dia = dt.getUTCDay() || 7;
    dt.setUTCDate(dt.getUTCDate() + 4 - dia);
    const anio = dt.getUTCFullYear();
    const sem = Math.ceil(((dt - Date.UTC(anio, 0, 1)) / 864e5 + 1) / 7);
    return `${anio}-W${pad(sem)}`;
  }
  function lunesDeSemana(clave) {
    const [a, w] = clave.split('-W').map(Number);
    const ene4 = new Date(Date.UTC(a, 0, 4));
    const dia = ene4.getUTCDay() || 7;
    const l = new Date(Date.UTC(a, 0, 4 - dia + 1 + (w - 1) * 7));
    return `${l.getUTCFullYear()}-${pad(l.getUTCMonth() + 1)}-${pad(l.getUTCDate())}`;
  }
  const sumarSemanas = (clave, n) => semanaISO(sumarDias(lunesDeSemana(clave), 7 * n));
  function rangoSemanas(desde, hasta) {
    const out = []; let k = desde, g = 0;
    while (k <= hasta && g++ < 600) { out.push(k); k = sumarSemanas(k, 1); }
    return out;
  }
  const base = () => { const t = ahora(); return { id: uuid(), created_at: t, updated_at: t, eliminado: false }; };

  const nuevaTabla = p => ({ ...base(), codigo: '', nombre: '', superficie_ha: null, variedad: '', geometria: null, activa: true, origen: 'manual', ...p });
  const nuevoUsuario = p => ({ ...base(), nombre: '', rol: 'operador', activo: true, ...p });
  const nuevoRecorrido = ({ fecha, usuario_id }) => ({ ...base(), fecha, semana_iso: semanaISO(fecha), usuario_id, estado: 'en_curso' });
  const nuevaEvaluacion = ({ recorrido_id, tabla_id, tipo = 'stover' }) => ({ ...base(), recorrido_id, tabla_id, tipo, hora_inicio: null, hora_fin: null, plantas: [] });
  function ajustarHojas(planta, th) {
    const hojas = (planta.hojas || []).slice(0, th);
    for (let i = hojas.length + 1; i <= th; i++) hojas.push({ id: uuid(), planta_id: planta.id, numero_hoja: i, grado_gauhl: null });
    return hojas;
  }
  function nuevaPlanta(evaluacion_tabla_id, numero, previa) {
    const b = base(); delete b.eliminado;
    const p = { ...b, evaluacion_tabla_id, numero_planta: numero, total_hojas: previa ? previa.total_hojas : 10,
      hmj_pizca: null, hmj_estria: null, hmj_mancha: null, observaciones: '', gps: null, hojas: [] };
    p.hojas = ajustarHojas(p, p.total_hojas);
    return p;
  }
  const nuevaAplicacion = p => ({ ...base(), fecha: hoy(), tabla_ids: [], producto: '', ingrediente_activo: '', grupo_frac: '',
    dosis: null, unidad: 'L/ha', volumen_mezcla: null, metodo: 'Terrestre', usuario_id: null, responsable: '', observaciones: '', ...p });
  const configInicial = () => ({ id: 'umbrales', created_at: ahora(), updated_at: ahora(), eliminado: false,
    ii_verde: 20, ii_amarillo: 30, dias_alerta_aplicacion: 14, rancho_lat: 18.885, rancho_lon: -103.905 });

  return { uuid, ahora, hoy, sumarDias, diasEntre, semanaISO, lunesDeSemana, sumarSemanas, rangoSemanas, ajustarHojas,
    nuevaTabla, nuevoUsuario, nuevoRecorrido, nuevaEvaluacion, nuevaPlanta, nuevaAplicacion, configInicial };
})();

/* =====================================================================
   CAPA 2 — CÁLCULOS (funciones puras, reutilizables en servidor)
   ===================================================================== */
const Calc = (() => {
  const GRADOS = [
    { g: 0, rango: 'Sin síntomas' }, { g: 1, rango: '≤10 manchas o <1 %' }, { g: 2, rango: '1–5 %' },
    { g: 3, rango: '6–15 %' }, { g: 4, rango: '16–33 %' }, { g: 5, rango: '34–50 %' }, { g: 6, rango: '51–100 %' }];
  const N_GRADOS = 7;
  const completa = p => p.total_hojas > 0 && p.hojas.length === p.total_hojas && p.hojas.every(h => h.grado_gauhl != null);
  const hf = p => p.hojas.filter(h => h.grado_gauhl != null && h.grado_gauhl <= 4).length;
  // II = [Σ(n·b) / ((N−1)·T)] × 100 ; T = hojas evaluadas (calificadas)
  function ii(grados) {
    const g = grados.filter(x => x != null);
    if (!g.length) return null;
    return g.reduce((a, b) => a + b, 0) / ((N_GRADOS - 1) * g.length) * 100;
  }
  const iiPlanta = p => ii(p.hojas.map(h => h.grado_gauhl));
  const prom = arr => { const v = arr.filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  function sintoma(ps, k) {
    const vals = ps.map(p => p[k]);
    return { prom: prom(vals.filter(v => v > 0)), no_presenta: vals.filter(v => v === 0).length, sin_capturar: vals.filter(v => v == null).length };
  }
  function resumen(plantas) {
    const ps = (plantas || []).filter(p => p && !p.eliminado);
    const todas = ps.flatMap(p => p.hojas.map(h => h.grado_gauhl));
    return { n: ps.length, completas: ps.filter(completa).length, ii: ii(todas), th: prom(ps.map(p => p.total_hojas)), hf: prom(ps.map(hf)),
      pizca: sintoma(ps, 'hmj_pizca'), estria: sintoma(ps, 'hmj_estria'), mancha: sintoma(ps, 'hmj_mancha'),
      hojas_evaluadas: todas.filter(x => x != null).length };
  }
  function distribucion(plantas) {
    const max = Math.max(0, ...plantas.map(p => p.hojas.length));
    const m = Array.from({ length: max }, () => [0, 0, 0, 0, 0, 0, 0]);
    plantas.forEach(p => p.hojas.forEach(h => { if (h.grado_gauhl != null) m[h.numero_hoja - 1][h.grado_gauhl]++; }));
    return m;
  }
  function validar(p) {
    const errores = [], avisos = [];
    const th = p.total_hojas;
    [['hmj_pizca', 'pizca'], ['hmj_estria', 'estría'], ['hmj_mancha', 'mancha']].forEach(([k, n]) => {
      if (p[k] > th) errores.push(`La hoja más joven con ${n} (${p[k]}) es mayor que el total de hojas (${th}).`);
      if (p[k] == null) avisos.push(`Falta indicar la hoja más joven con ${n}.`);
    });
    const a = p.hmj_pizca, b = p.hmj_estria, c = p.hmj_mancha;
    if (a > 0 && b > 0 && a > b) avisos.push('La pizca está en una hoja más vieja que la estría; lo normal es pizca ≤ estría.');
    if (b > 0 && c > 0 && b > c) avisos.push('La estría está en una hoja más vieja que la mancha; lo normal es estría ≤ mancha.');
    if (a > 0 && c > 0 && a > c && !(b > 0)) avisos.push('La pizca está en una hoja más vieja que la mancha.');
    const faltan = p.hojas.filter(h => h.grado_gauhl == null).length;
    if (faltan) avisos.push(`Faltan ${faltan} hoja(s) por calificar.`);
    return { errores, avisos };
  }
  function semaforo(v, u) { if (v == null) return 'sin'; if (v < u.ii_verde) return 'verde'; if (v < u.ii_amarillo) return 'amarillo'; return 'rojo'; }
  return { GRADOS, completa, hf, ii, iiPlanta, prom, resumen, distribucion, validar, semaforo };
})();

/* =====================================================================
   CAPA 2b — ANÁLISIS: agregación semanal, aplicaciones, clima
   ===================================================================== */
const vivos = obj => Object.values(obj || {}).filter(r => r && !r.eliminado);

const Analisis = (() => {
  const INDICADORES = [
    { k: 'ii', nombre: 'Índice de infección', corto: 'II', unidad: '%', dec: 1, peorSi: 'sube', get: r => r.ii },
    { k: 'th', nombre: 'Total de hojas', corto: 'TH', unidad: '', dec: 1, peorSi: 'baja', get: r => r.th },
    { k: 'hf', nombre: 'Hojas funcionales', corto: 'HF', unidad: '', dec: 1, peorSi: 'baja', get: r => r.hf },
    { k: 'hmje', nombre: 'Hoja más joven con estría', corto: 'HMJE', unidad: '', dec: 1, peorSi: 'baja', get: r => r.estria.prom },
    { k: 'hmjm', nombre: 'Hoja más joven con mancha', corto: 'HMJM', unidad: '', dec: 1, peorSi: 'baja', get: r => r.mancha.prom },
    { k: 'pizca', nombre: 'Hoja más joven con pizca', corto: 'Pizca', unidad: '', dec: 1, peorSi: 'baja', get: r => r.pizca.prom }];
  function filas(datos, f = {}) {
    const recs = datos.recorridos;
    const out = [];
    vivos(datos.evaluaciones).forEach(ev => {
      if (ev.tipo !== 'stover') return;
      const rec = recs[ev.recorrido_id];
      if (!rec || rec.eliminado) return;
      if (f.desde && rec.fecha < f.desde) return;
      if (f.hasta && rec.fecha > f.hasta) return;
      if (f.operador && rec.usuario_id !== f.operador) return;
      if (f.tablas && f.tablas.length && !f.tablas.includes(ev.tabla_id)) return;
      out.push({ ev, rec, semana: rec.semana_iso, tabla_id: ev.tabla_id });
    });
    return out;
  }
  // Map tabla_id -> Map semana -> {resumen, plantas}
  function serie(fs) {
    const tmp = new Map();
    fs.forEach(x => {
      if (!tmp.has(x.tabla_id)) tmp.set(x.tabla_id, new Map());
      const m = tmp.get(x.tabla_id);
      if (!m.has(x.semana)) m.set(x.semana, []);
      m.get(x.semana).push(...x.ev.plantas);
    });
    const out = new Map();
    tmp.forEach((m, t) => { const mm = new Map(); m.forEach((ps, s) => { if (ps.length) mm.set(s, { r: Calc.resumen(ps), plantas: ps }); }); out.set(t, mm); });
    return out;
  }
  function valorEn(serieTabla, semana, ind) { const x = serieTabla && serieTabla.get(semana); return x ? ind.get(x.r) : null; }
  function previa(serieTabla, semana) {
    if (!serieTabla) return null;
    const ks = [...serieTabla.keys()].filter(k => k < semana).sort();
    return ks.length ? ks[ks.length - 1] : null;
  }
  function aplicacionesDeTabla(datos, tablaId) {
    return vivos(datos.aplicaciones).filter(a => a.tabla_ids.includes(tablaId)).sort((a, b) => a.fecha.localeCompare(b.fecha));
  }
  function ultimaAplicacion(datos, tablaId, hasta) {
    const l = aplicacionesDeTabla(datos, tablaId).filter(a => !hasta || a.fecha <= hasta);
    return l.length ? l[l.length - 1] : null;
  }
  // Repetición de grupo FRAC en aplicaciones consecutivas de una tabla
  function repeticionesFrac(datos) {
    const res = [];
    vivos(datos.tablas).forEach(t => {
      const l = aplicacionesDeTabla(datos, t.id);
      for (let i = 1; i < l.length; i++) {
        if (l[i].grupo_frac && l[i].grupo_frac === l[i - 1].grupo_frac) res.push({ tabla: t, a: l[i], b: l[i - 1] });
      }
    });
    return res;
  }
  // Efecto: II en la semana de aplicación (o la previa evaluada) vs 2 y 4 semanas después
  function efectoAplicacion(serieCompleta, app, tablaId) {
    const st = serieCompleta.get(tablaId);
    if (!st) return null;
    const s0 = Modelo.semanaISO(app.fecha);
    const ii = Analisis.INDICADORES[0];
    let antesSem = st.has(s0) ? s0 : previa(st, s0);
    const antes = antesSem ? valorEn(st, antesSem, ii) : null;
    const buscar = (n) => { for (const d of [n, n + 1, n - 1]) { const k = Modelo.sumarSemanas(s0, d); if (st.has(k)) return { sem: k, v: valorEn(st, k, ii) }; } return null; };
    const d2 = buscar(2), d4 = buscar(4);
    return { antesSem, antes, d2, d4 };
  }
  return { INDICADORES, filas, serie, valorEn, previa, aplicacionesDeTabla, ultimaAplicacion, repeticionesFrac, efectoAplicacion };
})();

const Clima = (() => {
  const CAMPOS = ['fecha', 'temp_max', 'temp_min', 'temp_media', 'hr_media', 'precipitacion', 'horas_hr_alta'];
  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  // Datos simulados con estacionalidad aproximada de Tecomán (lluvias jun–oct)
  function simular(desde, hasta, seed = 11) {
    const r = rng(seed);
    const pLluvia = [0.05, 0.03, 0.02, 0.02, 0.05, 0.40, 0.60, 0.62, 0.66, 0.42, 0.10, 0.05];
    const out = []; let f = desde, g = 0, humedo = 0;
    while (f <= hasta && g++ < 1500) {
      const mes = Number(f.slice(5, 7)) - 1;
      const llueve = r() < pLluvia[mes] + humedo * 0.15;
      humedo = llueve ? 1 : humedo * 0.5;
      const lluvioso = pLluvia[mes] > 0.3;
      const pp = llueve ? Math.round((-Math.log(1 - r()) * (lluvioso ? 16 : 6)) * 10) / 10 : 0;
      const tmax = 31 + (mes >= 3 && mes <= 5 ? 1.6 : 0) - (llueve ? 1.8 : 0) + (r() - 0.5) * 2;
      const tmin = (lluvioso ? 23 : mes <= 1 || mes === 11 ? 17.5 : 20) + (r() - 0.5) * 2;
      const hr = Math.min(98, (lluvioso ? 80 : 66) + (llueve ? 8 : 0) + (r() - 0.5) * 8);
      const horas = Math.max(0, Math.round(((hr - 62) / 36) * 16 + (llueve ? 2 : 0) + (r() - 0.5) * 3));
      out.push({ fecha: f, temp_max: +tmax.toFixed(1), temp_min: +tmin.toFixed(1), temp_media: +((tmax + tmin) / 2).toFixed(1),
        hr_media: +hr.toFixed(1), precipitacion: pp, horas_hr_alta: Math.min(24, horas), fuente: 'simulado' });
      f = Modelo.sumarDias(f, 1);
    }
    return out;
  }
  function parseCSV(texto) {
    const lineas = texto.replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim());
    if (lineas.length < 2) throw new Error('El CSV no tiene filas de datos.');
    const sep = (lineas[0].match(/;/g) || []).length > (lineas[0].match(/,/g) || []).length ? ';' : ',';
    const cab = lineas[0].split(sep).map(s => s.trim().toLowerCase());
    const idx = Object.fromEntries(CAMPOS.map(c => [c, cab.indexOf(c)]));
    if (idx.fecha < 0) throw new Error('Falta la columna "fecha" (formato AAAA-MM-DD).');
    const dias = [];
    lineas.slice(1).forEach(l => {
      const c = l.split(sep).map(s => s.trim());
      const fecha = c[idx.fecha];
      if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return;
      const num = k => idx[k] >= 0 && c[idx[k]] !== '' ? Number(c[idx[k]].replace(',', '.')) : null;
      const d = { fecha, fuente: 'csv' };
      CAMPOS.slice(1).forEach(k => { d[k] = num(k); });
      if (d.temp_media == null && d.temp_max != null && d.temp_min != null) d.temp_media = +((d.temp_max + d.temp_min) / 2).toFixed(1);
      dias.push(d);
    });
    if (!dias.length) throw new Error('No se encontró ninguna fila con fecha válida.');
    return dias;
  }
  function todosLosDias(datos) { return vivos(datos.clima).flatMap(m => m.dias || []).sort((a, b) => a.fecha.localeCompare(b.fecha)); }
  function porSemana(dias) {
    const m = new Map();
    dias.forEach(d => {
      const k = Modelo.semanaISO(d.fecha);
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(d);
    });
    const out = new Map();
    m.forEach((ds, k) => {
      const p = c => Calc.prom(ds.map(d => d[c]));
      const s = c => { const v = ds.map(d => d[c]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) : null; };
      out.set(k, { dias: ds.length, temp_max: p('temp_max'), temp_min: p('temp_min'), temp_media: p('temp_media'), hr_media: p('hr_media'),
        precipitacion: s('precipitacion'), horas_hr_alta: s('horas_hr_alta'), dias_lluvia: ds.filter(d => d.precipitacion > 1).length });
    });
    return out;
  }
  // Documentos por mes (agrupación del prototipo); en producción, una fila por día en ClimaDiario
  function aDocumentosMes(dias, existentes) {
    const porMes = {};
    dias.forEach(d => { const k = d.fecha.slice(0, 7); (porMes[k] = porMes[k] || {})[d.fecha] = d; });
    return Object.entries(porMes).map(([mes, nuevos]) => {
      const prev = existentes[mes];
      const mapa = {};
      (prev && !prev.eliminado ? prev.dias : []).forEach(d => { mapa[d.fecha] = d; });
      Object.assign(mapa, nuevos);
      const t = Modelo.ahora();
      return { id: mes, mes, dias: Object.values(mapa).sort((a, b) => a.fecha.localeCompare(b.fecha)),
        created_at: prev ? prev.created_at : t, updated_at: t, eliminado: false };
    });
  }
  return { CAMPOS, rng, simular, parseCSV, todosLosDias, porSemana, aDocumentosMes };
})();

/* =====================================================================
   CAPA 2c — IMPORTACIÓN DE POLÍGONOS (KMZ / KML)
   ===================================================================== */
const Geo = (() => {
  const parseCoords = s => s.trim().split(/\s+/).map(t => t.split(',').map(Number))
    .filter(a => a.length >= 2 && !isNaN(a[0]) && !isNaN(a[1])).map(a => [a[0], a[1]]);
  function areaHa(anillo) {
    if (!anillo || anillo.length < 3) return 0;
    const lat0 = anillo.reduce((s, p) => s + p[1], 0) / anillo.length;
    const k = Math.cos(lat0 * Math.PI / 180);
    let a = 0;
    for (let i = 0; i < anillo.length; i++) {
      const [x1, y1] = anillo[i], [x2, y2] = anillo[(i + 1) % anillo.length];
      a += (x1 * 111320 * k) * (y2 * 110574) - (x2 * 111320 * k) * (y1 * 110574);
    }
    return Math.abs(a) / 2 / 10000;
  }
  const centroide = anillo => [anillo.reduce((s, p) => s + p[0], 0) / anillo.length, anillo.reduce((s, p) => s + p[1], 0) / anillo.length];
  const cerrar = a => (a.length && (a[0][0] !== a[a.length - 1][0] || a[0][1] !== a[a.length - 1][1])) ? [...a, a[0]] : a;
  async function leer(file) {
    let texto;
    if (/\.kmz$/i.test(file.name)) {
      if (!window.JSZip) throw new Error('No se pudo cargar el lector de KMZ. Revisa tu conexión e intenta de nuevo.');
      const zip = await JSZip.loadAsync(file);
      const kml = Object.values(zip.files).find(f => /\.kml$/i.test(f.name));
      if (!kml) throw new Error('El KMZ no contiene un archivo KML.');
      texto = await kml.async('string');
    } else texto = await file.text();
    const xml = new DOMParser().parseFromString(texto, 'application/xml');
    if (xml.getElementsByTagName('parsererror').length) throw new Error('El archivo KML no es válido.');
    const tag = (el, n) => [...el.getElementsByTagNameNS('*', n)];
    const res = [];
    tag(xml, 'Placemark').forEach((pm, i) => {
      const nombre = ((tag(pm, 'name')[0] || {}).textContent || '').trim() || `Tabla ${i + 1}`;
      let anillos = tag(pm, 'Polygon').map(pg => { const ob = tag(pg, 'outerBoundaryIs')[0] || pg; const c = tag(ob, 'coordinates')[0]; return parseCoords(c ? c.textContent : ''); });
      if (!anillos.length) anillos = [...tag(pm, 'LinearRing'), ...tag(pm, 'LineString')].map(l => { const c = tag(l, 'coordinates')[0]; return parseCoords(c ? c.textContent : ''); });
      anillos = anillos.filter(a => a.length >= 3).sort((a, b) => areaHa(b) - areaHa(a));
      if (!anillos.length) return;
      res.push({ nombre, anillo: cerrar(anillos[0]) });
    });
    if (!res.length) throw new Error('No se encontraron polígonos en el archivo.');
    return res;
  }
  // Catálogo de ejemplo cerca de Tecomán (reemplazar con el KMZ real)
  function catalogoEjemplo() {
    const lat0 = 18.884, lon0 = -103.912, dLat = 0.0029, dLon = 0.0031;
    const out = [];
    let n = 1;
    for (let f = 0; f < 3; f++) for (let c = 0; c < 4; c++) {
      const y = lat0 - f * dLat * 1.05, x = lon0 + c * dLon * 1.04 + f * 0.0004;
      const j = (n * 37 % 10) / 10000;
      const anillo = cerrar([[x, y], [x + dLon + j, y + 0.0002], [x + dLon, y - dLat], [x - 0.0001, y - dLat + j]]);
      out.push({ nombre: `T-${String(n).padStart(2, '0')}`, anillo, variedad: n % 4 === 0 ? 'Macho' : 'Gran Enano' });
      n++;
    }
    return out;
  }
  return { leer, areaHa, centroide, catalogoEjemplo };
})();

/* =====================================================================
   CAPA 3 — ALMACÉN LOCAL (IndexedDB → misma API en la PWA)
   ===================================================================== */
const COLECCIONES = ['tablas', 'usuarios', 'config', 'recorridos', 'evaluaciones', 'aplicaciones', 'clima'];

const Almacen = (() => {
  let dbp = null, modo = 'indexeddb';
  const mem = new Map();
  function abrir() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('sigatoka-prototipo', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('registros', { keyPath: 'k' });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function cargarTodo() {
    try {
      const db = await abrir();
      return await new Promise((res, rej) => {
        const q = db.transaction('registros', 'readonly').objectStore('registros').getAll();
        q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error);
      });
    } catch (e) { modo = 'memoria'; return []; }
  }
  async function guardarVarios(items) {
    const vals = items.map(({ col, rec, pendiente }) => ({ k: col + '/' + rec.id, col, pendiente, data: rec }));
    if (modo === 'memoria') { vals.forEach(v => mem.set(v.k, v)); return; }
    try {
      const db = await abrir();
      await new Promise((res, rej) => {
        const tx = db.transaction('registros', 'readwrite');
        const st = tx.objectStore('registros');
        vals.forEach(v => st.put(v));
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    } catch (e) { modo = 'memoria'; vals.forEach(v => mem.set(v.k, v)); }
  }
  async function borrarTodo() {
    mem.clear();
    try { const db = await abrir(); await new Promise(r => { const tx = db.transaction('registros', 'readwrite'); tx.objectStore('registros').clear(); tx.oncomplete = r; tx.onerror = r; }); } catch (e) { }
  }
  async function borrar(k) {
    mem.delete(k);
    if (modo === 'memoria') return;
    try { const db = await abrir(); await new Promise(r => { const tx = db.transaction('registros', 'readwrite'); tx.objectStore('registros').delete(k); tx.oncomplete = r; tx.onerror = r; }); } catch (e) { }
  }
  return { cargarTodo, guardarVarios, borrar, borrarTodo, get modo() { return modo; } };
})();

/* =====================================================================
   CAPA 4 — ESTADO EN MEMORIA + COLA DE SINCRONIZACIÓN
   ===================================================================== */
const Store = (() => {
  let estado = {
    cargado: false,
    datos: Object.fromEntries(COLECCIONES.map(c => [c, {}])),
    pendientes: {},
    sync: { modo: 'detectando', online: navigator.onLine, simularOffline: false, enviando: false, ultimo: null, error: null, listo: false }
  };
  const subs = new Set();
  const emitir = () => { estado = { ...estado }; subs.forEach(f => f()); };
  const get = () => estado;
  const suscribir = f => { subs.add(f); return () => subs.delete(f); };
  async function cargar() {
    const regs = await Almacen.cargarTodo();
    const datos = Object.fromEntries(COLECCIONES.map(c => [c, {}]));
    const pend = {};
    regs.forEach(r => { if (datos[r.col]) { datos[r.col][r.data.id] = r.data; if (r.pendiente) pend[r.k] = true; } });
    estado = { ...estado, datos, pendientes: pend, cargado: true };
    emitir();
  }
  function aplicar(col, recs, pendiente) {
    const c = { ...estado.datos[col] };
    const p = { ...estado.pendientes };
    recs.forEach(r => { c[r.id] = r; if (pendiente) p[col + '/' + r.id] = true; else delete p[col + '/' + r.id]; });
    estado.datos = { ...estado.datos, [col]: c };
    estado.pendientes = p;
  }
  function put(col, rec) {
    const r = { ...rec, updated_at: Modelo.ahora() };
    aplicar(col, [r], true);
    Almacen.guardarVarios([{ col, rec: r, pendiente: true }]);
    emitir(); Sync.programar();
    return r;
  }
  function putMuchos(col, recs) {
    if (!recs.length) return;
    const t = Modelo.ahora();
    const rs = recs.map(r => ({ ...r, updated_at: r.updated_at && r._conservarFecha ? r.updated_at : t }));
    rs.forEach(r => delete r._conservarFecha);
    aplicar(col, rs, true);
    Almacen.guardarVarios(rs.map(rec => ({ col, rec, pendiente: true })));
    emitir(); Sync.programar();
  }
  function eliminar(col, id) { const r = estado.datos[col][id]; if (r) put(col, { ...r, eliminado: true }); }
  function mergeRemoto(col, rec) {
    const local = estado.datos[col] && estado.datos[col][rec.id];
    if (local && local.updated_at >= rec.updated_at) return false;
    aplicar(col, [rec], false);
    Almacen.guardarVarios([{ col, rec, pendiente: false }]);
    return true;
  }
  function quitarRemoto(col, id) {
    const k = col + '/' + id;
    if (!estado.datos[col] || !estado.datos[col][id] || estado.pendientes[k]) return false;
    const c = { ...estado.datos[col] }; delete c[id];
    estado.datos = { ...estado.datos, [col]: c };
    Almacen.borrar(k);
    return true;
  }
  function marcarSincronizado(col, rec) {
    aplicar(col, [rec], false);
    Almacen.guardarVarios([{ col, rec, pendiente: false }]);
    emitir();
  }
  function setSync(cambios) { estado.sync = { ...estado.sync, ...cambios }; emitir(); }
  async function borrarLocal() {
    await Almacen.borrarTodo();
    estado = { ...estado, datos: Object.fromEntries(COLECCIONES.map(c => [c, {}])), pendientes: {} };
    emitir();
  }
  return { get, suscribir, cargar, put, putMuchos, eliminar, mergeRemoto, quitarRemoto, marcarSincronizado, setSync, emitir, borrarLocal };
})();

const Sync = (() => {
  let db = null, timer = null, corriendo = false, pausado = false, unsubs = [], recibidos = new Set();
  const conectado = () => { const s = Store.get().sync; return s.online && !s.simularOffline; };
  async function iniciar() {
    try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch (e) { db = null; }
    Store.setSync({ modo: db ? 'servidor' : 'local' });
    window.addEventListener('online', () => { Store.setSync({ online: true }); reconectar(); });
    window.addEventListener('offline', () => Store.setSync({ online: false }));
    if (db && conectado()) {
      suscribir();
      setTimeout(() => { if (!Store.get().sync.listo) Store.setSync({ listo: true }); }, 6000);
    } else Store.setSync({ listo: true });
    programar(800);
  }
  function cancelar() { unsubs.forEach(u => { try { u(); } catch (e) { } }); unsubs = []; }
  function suscribir() {
    cancelar(); recibidos = new Set();
    COLECCIONES.forEach(col => {
      try {
        const u = db.collection(col).onSnapshot(snap => {
          recibidos.add(col);
          if (conectado()) {
            let cambio = false;
            snap.docChanges().forEach(ch => {
              if (ch.type === 'removed') { if (Store.quitarRemoto(col, ch.doc.id)) cambio = true; return; }
              const d = ch.doc.data();
              if (d && d.id && Store.mergeRemoto(col, JSON.parse(JSON.stringify(d)))) cambio = true;
            });
            if (cambio) Store.emitir();
          }
          if (recibidos.size === COLECCIONES.length && !Store.get().sync.listo) Store.setSync({ listo: true, ultimo: Modelo.ahora() });
        }, err => Store.setSync({ error: err && err.code ? err.code : 'error', listo: true }));
        unsubs.push(u);
      } catch (e) { Store.setSync({ error: 'suscripcion' }); }
    });
  }
  function reconectar() { if (db && conectado() && !pausado) { suscribir(); programar(300); } }
  function detener() { pausado = true; cancelar(); clearTimeout(timer); }
  function reanudar() { pausado = false; reconectar(); }
  // Borra todos los documentos del almacén compartido (reinicio del rancho)
  async function borrarServidor(onProgreso) {
    while (corriendo) await new Promise(r => setTimeout(r, 200));
    let n = 0;
    for (const col of COLECCIONES) {
      for (let vuelta = 0; vuelta < 60; vuelta++) {
        const snap = await db.collection(col).limit(500).get();
        if (snap.empty) break;
        for (const d of snap.docs) {
          try { await db.collection(col).doc(d.id).delete(); }
          catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 800)); await db.collection(col).doc(d.id).delete(); } else throw e; }
          n++; if (onProgreso) onProgreso(n);
        }
      }
    }
    return n;
  }
  async function empujar() {
    if (!db || corriendo || pausado || !conectado()) return;
    const pend = Object.keys(Store.get().pendientes);
    if (!pend.length) return;
    corriendo = true; Store.setSync({ enviando: true });
    let error = null;
    for (const k of pend) {
      if (!conectado() || pausado) break;
      const i = k.indexOf('/'); const col = k.slice(0, i), id = k.slice(i + 1);
      const rec = Store.get().datos[col] && Store.get().datos[col][id];
      if (!rec) continue;
      const enviar = (col === 'recorridos' && rec.estado === 'cerrado') ? { ...rec, estado: 'sincronizado' } : rec;
      try {
        await escribir(col, id, JSON.parse(JSON.stringify(enviar)));
        const actual = Store.get().datos[col][id];
        if (actual && actual.updated_at === rec.updated_at) Store.marcarSincronizado(col, enviar);
      } catch (e) { error = (e && e.code) || 'error'; if (error === 'quota_exceeded' || error === 'invalid_argument' || error === 'revoked') break; }
    }
    corriendo = false;
    Store.setSync({ enviando: false, error, ultimo: error ? Store.get().sync.ultimo : Modelo.ahora() });
    if (!error && Object.keys(Store.get().pendientes).length && conectado()) programar(1500);
    else if (error === 'unavailable' || error === 'resource_exhausted') programar(15000);
  }
  async function escribir(col, id, data) {
    try { await db.collection(col).doc(id).set(data); }
    catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 900)); await db.collection(col).doc(id).set(data); } else throw e; }
  }
  function programar(ms = 1500) { clearTimeout(timer); timer = setTimeout(empujar, ms); }
  function simularSinSenal(v) { Store.setSync({ simularOffline: v }); if (!v) reconectar(); }
  return { iniciar, programar, simularSinSenal, detener, reanudar, borrarServidor, conectado, ahora: () => programar(50), get disponible() { return !!db; } };
})();

const Reinicio = {
  // Borra todo: almacén compartido (si existe), IndexedDB y preferencias locales
  async todo(onProgreso) {
    if (Sync.disponible && !Sync.conectado()) throw new Error('Necesitas conexión para vaciar el almacén compartido.');
    Sync.detener();
    try {
      if (Sync.disponible) await Sync.borrarServidor(onProgreso);
      await Store.borrarLocal();
      ['nav', 'tab', 'usuario', 'f.desde', 'f.hasta'].forEach(k => { try { localStorage.removeItem('sigatoka.' + k); } catch (e) { } });
      window.dispatchEvent(new CustomEvent('reinicio'));
    } finally { Sync.reanudar(); }
  }
};

const Demo = (() => {
  const PRODUCTOS = [
    { producto: 'Mancozeb 80 PH', ia: 'Mancozeb', frac: 'M03', dosis: 2.5, unidad: 'kg/ha' },
    { producto: 'Difenoconazol 250 CE', ia: 'Difenoconazol', frac: '3', dosis: 0.4, unidad: 'L/ha' },
    { producto: 'Azoxistrobina 250 SC', ia: 'Azoxistrobina', frac: '11', dosis: 0.4, unidad: 'L/ha' },
    { producto: 'Pirimetanil 400 SC', ia: 'Pirimetanil', frac: '9', dosis: 1.0, unidad: 'L/ha' },
    { producto: 'Fluopiram 500 SC', ia: 'Fluopiram', frac: '7', dosis: 0.3, unidad: 'L/ha' },
    { producto: 'Clorotalonil 720 SC', ia: 'Clorotalonil', frac: 'M05', dosis: 1.5, unidad: 'L/ha' }];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function planta(evId, num, s, r) {
    const p = Modelo.nuevaPlanta(evId, num, null);
    const th = clamp(Math.round(13 - 3 * s + (r() - 0.5) * 3), 6, 16);
    const onset = 5.6 - 3 * s + (r() - 0.5) * 1.2, slope = 0.18 + 0.62 * s;
    let prev = 0;
    p.total_hojas = th;
    p.hojas = [];
    for (let i = 1; i <= th; i++) {
      let g = clamp(Math.round(Math.max(0, i - onset) * slope + (r() - 0.5) * 0.9), 0, 6);
      if (i <= 2 && r() < 0.9) g = 0;
      g = Math.max(g, prev - 1); prev = g;
      p.hojas.push({ id: Modelo.uuid(), planta_id: p.id, numero_hoja: i, grado_gauhl: g });
    }
    const primera = min => { const h = p.hojas.find(h => h.grado_gauhl >= min); return h ? h.numero_hoja : 0; };
    p.hmj_pizca = primera(1); p.hmj_estria = primera(2); p.hmj_mancha = primera(3);
    if (r() < 0.06) p.observaciones = ['Racimo pequeño', 'Planta con hijo de agua cerca', 'Hoja doblada por viento'][Math.floor(r() * 3)];
    return p;
  }
  function generar(datos, umbrales) {
    const r = Clima.rng(42);
    const tablas = vivos(datos.tablas).filter(t => t.activa);
    const usuarios = vivos(datos.usuarios);
    const ops = usuarios.filter(u => u.rol === 'operador');
    const admin = usuarios.find(u => u.rol === 'administrador') || usuarios[0];
    const semAct = Modelo.semanaISO(Modelo.hoy());
    const semanas = Modelo.rangoSemanas(Modelo.sumarSemanas(semAct, -16), Modelo.sumarSemanas(semAct, -1));
    const diasClima = Clima.simular(Modelo.lunesDeSemana(Modelo.sumarSemanas(semAct, -24)), Modelo.hoy(), 7);
    const cs = Clima.porSemana(diasClima);
    const sev = {}, efecto = {}, ultima = {}, ultFrac = {}, susc = {};
    tablas.forEach(t => { sev[t.id] = 0.12 + 0.25 * r(); efecto[t.id] = 0; susc[t.id] = 0.7 + 0.6 * r(); });
    const recorridos = [], evaluaciones = [], aplicaciones = [];
    let iProd = 0, nApp = 0, repetida = false;
    const marca = o => ({ ...o, origen: 'demo' });
    semanas.forEach((sem, si) => {
      const fecha = Modelo.sumarDias(Modelo.lunesDeSemana(sem), 1);
      const c = cs.get(Modelo.sumarSemanas(sem, -4));
      const fav = c ? Math.min(1, (c.horas_hr_alta / 7) / 13 * 0.7 + Math.min(c.precipitacion || 0, 120) / 120 * 0.3) : 0.3;
      const op = ops.length ? ops[si % ops.length] : admin;
      const rec = marca(Modelo.nuevoRecorrido({ fecha, usuario_id: op.id }));
      rec.estado = 'cerrado';
      recorridos.push(rec);
      const iiT = {};
      tablas.forEach((t, ti) => {
        let s = sev[t.id] * 0.6 + fav * 0.36 * susc[t.id] + (r() - 0.5) * 0.08;
        if (efecto[t.id] > 0) { s -= 0.15; efecto[t.id]--; }
        s = clamp(s, 0.05, 0.95); sev[t.id] = s;
        const ev = marca(Modelo.nuevaEvaluacion({ recorrido_id: rec.id, tabla_id: t.id }));
        ev.hora_inicio = `${fecha}T07:${String(10 + ti * 3).padStart(2, '0')}:00`;
        ev.hora_fin = `${fecha}T07:${String(12 + ti * 3).padStart(2, '0')}:00`;
        const n = 18 + Math.floor(r() * 3);
        for (let k = 1; k <= n; k++) ev.plantas.push(planta(ev.id, k, s, r));
        evaluaciones.push(ev);
        iiT[t.id] = Calc.resumen(ev.plantas).ii;
      });
      const aplicar = tablas.filter(t => { const dd = ultima[t.id] ? Modelo.diasEntre(ultima[t.id], fecha) : 99; return (iiT[t.id] >= umbrales.ii_amarillo - 4 && dd >= 14) || (iiT[t.id] >= umbrales.ii_verde && dd >= 28); });
      if (aplicar.length) {
        nApp++;
        // Una aplicación repite a propósito el grupo FRAC anterior de la primera tabla (para mostrar la alerta)
        let pr = PRODUCTOS[iProd % PRODUCTOS.length];
        const t0 = aplicar.find(t => ultFrac[t.id]);
        if (!repetida && nApp >= 3 && t0) { pr = PRODUCTOS.find(x => x.frac === ultFrac[t0.id]) || pr; repetida = true; } else iProd++;
        const fApp = Modelo.sumarDias(fecha, 2);
        aplicaciones.push(marca(Modelo.nuevaAplicacion({ fecha: fApp, tabla_ids: aplicar.map(t => t.id), producto: pr.producto, ingrediente_activo: pr.ia,
          grupo_frac: pr.frac, dosis: pr.dosis, unidad: pr.unidad, volumen_mezcla: nApp % 2 ? 25 : 200, metodo: nApp % 2 ? 'Aérea' : 'Terrestre',
          usuario_id: admin.id, responsable: admin.nombre, observaciones: 'Dato de demostración' })));
        aplicar.forEach(t => { ultima[t.id] = fApp; efecto[t.id] = 3; ultFrac[t.id] = pr.frac; });
      }
    });
    // Recorrido abierto de la semana actual (para probar la captura)
    if (ops.length && tablas.length) {
      const rec = marca(Modelo.nuevoRecorrido({ fecha: Modelo.hoy(), usuario_id: ops[0].id }));
      recorridos.push(rec);
      tablas.slice(0, 2).forEach((t, i) => {
        const ev = marca(Modelo.nuevaEvaluacion({ recorrido_id: rec.id, tabla_id: t.id }));
        if (i === 0) { ev.hora_inicio = Modelo.ahora(); for (let k = 1; k <= 6; k++) ev.plantas.push(planta(ev.id, k, sev[t.id], r)); }
        evaluaciones.push(ev);
      });
    }
    const clima = Clima.aDocumentosMes(diasClima, datos.clima);
    return { recorridos, evaluaciones, aplicaciones, clima };
  }
  return { generar, PRODUCTOS };
})();

/* =====================================================================

const Exportar = (() => {
  const esc = v => { if (v == null) return ''; const s = String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = filas => '\ufeff' + filas.map(f => f.map(esc).join(',')).join('\r\n');
  const r1 = v => v == null ? null : Math.round(v * 10) / 10;
  function tablasPlano(datos, filtro) {
    const tablas = datos.tablas, usuarios = datos.usuarios;
    const fs = Analisis.filas(datos, filtro);
    const maxH = Math.max(0, ...fs.flatMap(x => x.ev.plantas.map(p => p.hojas.length)));
    const plantas = [['recorrido_id', 'fecha', 'semana_iso', 'operador', 'tabla', 'evaluacion_id', 'planta_id', 'numero_planta', 'total_hojas', 'hojas_funcionales', 'indice_infeccion',
      'hmj_pizca', 'hmj_estria', 'hmj_mancha', 'observaciones', ...Array.from({ length: maxH }, (_, i) => 'hoja_' + (i + 1))]];
    const hojas = [['planta_id', 'evaluacion_id', 'fecha', 'semana_iso', 'tabla', 'numero_planta', 'hoja_id', 'numero_hoja', 'grado_gauhl']];
    const np = v => v === 0 ? 'no presenta' : v;
    fs.forEach(({ ev, rec }) => {
      const t = tablas[ev.tabla_id], u = usuarios[rec.usuario_id];
      ev.plantas.forEach(p => {
        plantas.push([rec.id, rec.fecha, rec.semana_iso, u ? u.nombre : '', t ? t.codigo : '', ev.id, p.id, p.numero_planta, p.total_hojas, Calc.hf(p), r1(Calc.iiPlanta(p)),
          np(p.hmj_pizca), np(p.hmj_estria), np(p.hmj_mancha), p.observaciones, ...Array.from({ length: maxH }, (_, i) => p.hojas[i] ? p.hojas[i].grado_gauhl : '')]);
        p.hojas.forEach(h => hojas.push([p.id, ev.id, rec.fecha, rec.semana_iso, t ? t.codigo : '', p.numero_planta, h.id, h.numero_hoja, h.grado_gauhl]));
      });
    });
    const resumen = [['tabla', 'semana_iso', 'plantas', 'indice_infeccion', 'th_prom', 'hf_prom', 'pizca_prom', 'hmje_prom', 'hmjm_prom', 'plantas_sin_estria', 'plantas_sin_mancha']];
    const s = Analisis.serie(fs);
    s.forEach((m, tid) => [...m.keys()].sort().forEach(k => {
      const r = m.get(k).r; const t = tablas[tid];
      resumen.push([t ? t.codigo : tid, k, r.n, r1(r.ii), r1(r.th), r1(r.hf), r1(r.pizca.prom), r1(r.estria.prom), r1(r.mancha.prom), r.estria.no_presenta, r.mancha.no_presenta]);
    }));
    const apps = [['id', 'fecha', 'tablas', 'producto', 'ingrediente_activo', 'grupo_frac', 'dosis', 'unidad', 'volumen_mezcla_L_ha', 'metodo', 'responsable', 'observaciones']];
    vivos(datos.aplicaciones).sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(a => apps.push([a.id, a.fecha, a.tabla_ids.map(i => tablas[i] ? tablas[i].codigo : '').join(' '),
      a.producto, a.ingrediente_activo, a.grupo_frac, a.dosis, a.unidad, a.volumen_mezcla, a.metodo, a.responsable, a.observaciones]));
    const clima = [[...Clima.CAMPOS, 'fuente']];
    Clima.todosLosDias(datos).forEach(d => clima.push([...Clima.CAMPOS.map(c => d[c]), d.fuente]));
    return { plantas, hojas, resumen, apps, clima };
  }
  async function descargar(nombre, contenido) {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const d = await window.claude.use('downloads');
        if (d) { await d.save({ filename: nombre, data: contenido }); return 'ok'; }
      }
    } catch (e) { if (e && (e.code === 'declined' || e.code === 'rate_limited')) return 'cancelado'; }
    try {
      const blob = contenido instanceof Blob ? contenido : new Blob([contenido]);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
      return 'ok';
    } catch (e) { return 'error'; }
  }
  function excel(t) {
    if (!window.XLSX) throw new Error('No se pudo cargar el generador de Excel.');
    const wb = XLSX.utils.book_new();
    [['Resumen semanal', t.resumen], ['Plantas', t.plantas], ['Hojas', t.hojas], ['Aplicaciones', t.apps], ['Clima', t.clima]].forEach(([n, f]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(f), n));
    return new Uint8Array(XLSX.write(wb, { bookType: 'xlsx', type: 'array' }));
  }
  return { csv, tablasPlano, descargar, excel };
})();

let toastTimer;
function avisar(msg) { const ev = new CustomEvent('toast', { detail: msg }); window.dispatchEvent(ev); }
function Toast() {
  const [m, setM] = useState(null);
  useEffect(() => { const f = e => { setM(e.detail); clearTimeout(toastTimer); toastTimer = setTimeout(() => setM(null), 2600); }; window.addEventListener('toast', f); return () => window.removeEventListener('toast', f); }, []);
  return m ? html`<div className="toast" role="status">${m}</div>` : null;
}

// Confirmación dentro de la app: los diálogos nativos (confirm) pueden estar bloqueados en el visor
function confirmar(mensaje, opciones = {}) {
  return new Promise(res => window.dispatchEvent(new CustomEvent('confirmar', { detail: { mensaje, ...opciones, res } })));
}
function Dialogo() {
  const [d, setD] = useState(null);
  useEffect(() => { const f = e => setD(e.detail); window.addEventListener('confirmar', f); return () => window.removeEventListener('confirmar', f); }, []);
  if (!d) return null;
  const cerrar = v => { setD(null); d.res(v); };
  return html`<div className="velo" style=${{ zIndex: 90 }} onClick=${e => { if (e.target === e.currentTarget) cerrar(false); }}>
    <div className="hoja-sheet" role="alertdialog" aria-modal="true" aria-label=${d.titulo || 'Confirmar'}>
      ${d.titulo && html`<h2>${d.titulo}</h2>`}
      <div style=${{ whiteSpace: 'pre-line', margin: '10px 0 18px' }}>${d.mensaje}</div>
      <div className="fila-btn"><button className="btn" onClick=${() => cerrar(false)}>${d.cancelar || 'Cancelar'}</button>
        <button className=${'btn ' + (d.peligro ? 'btn-xp' : 'btn-p')} autoFocus onClick=${() => cerrar(true)}>${d.aceptar || 'Aceptar'}</button></div>
    </div></div>`;
}

/* ---------- Conexión y sincronización ---------- */
function Conexion() {
  const st = useStore();
  const [abierto, setAbierto] = useState(false);
  const s = st.sync;
  const npend = Object.keys(st.pendientes).length;
  const enLinea = s.online && !s.simularOffline;
  const local = s.modo !== 'servidor';
  const color = !enLinea ? 'var(--rojo)' : local ? 'var(--sin)' : npend ? 'var(--amarillo)' : 'var(--verde)';
  const texto = !enLinea ? 'Sin señal' : local ? 'Solo local' : s.enviando ? 'Enviando…' : npend ? `${npend} por enviar` : 'Al día';
  return html`<div style=${{ position: 'relative' }}>
    <button className="pill" onClick=${() => setAbierto(!abierto)} aria-expanded=${abierto}>
      <span className="punto" style=${{ background: color }}></span>${texto}${!enLinea && npend && !local ? ` (${npend})` : ''}
    </button>
    ${abierto && html`<div className="pop">
      <h3>Conexión y sincronización</h3>
      <p className="peq">${s.modo === 'servidor' ? 'Los datos se guardan en este dispositivo y se envían al almacén compartido del rancho.' : 'Este entorno no tiene almacén compartido: los datos se guardan solo en este dispositivo.'}</p>
      <p className="peq"><b>Registros pendientes:</b> ${npend}<br/><b>Último envío:</b> ${s.ultimo ? new Date(s.ultimo).toLocaleString('es-MX') : '—'}<br/><b>Almacén local:</b> ${Almacen.modo === 'indexeddb' ? 'IndexedDB' : 'memoria (se pierde al cerrar)'}</p>
      ${s.error && html`<div className="error peq">Error de sincronización: ${s.error}</div>`}
      <label className="interruptor"><input type="checkbox" checked=${s.simularOffline} onChange=${e => Sync.simularSinSenal(e.target.checked)} />Simular sin señal</label>
      <div className="fila-btn" style=${{ marginTop: 8 }}>
        <button className="btn btn-s" disabled=${!enLinea || s.modo !== 'servidor'} onClick=${() => { Sync.ahora(); setAbierto(false); }}>Sincronizar ahora</button>
        <button className="btn btn-s btn-q" onClick=${() => setAbierto(false)}>Cerrar</button>
      </div>
    </div>`}
  </div>`;
}

/* ---------- Bienvenida / configuración inicial ---------- */
function Bienvenida() {
  const [demo, setDemo] = useState(true);
  const [msg, setMsg] = useState(null);
  const [ocupado, setOcupado] = useState(false);
  const inp = useRef(null);
  async function crear(poligonos, origen) {
    setOcupado(true);
    const st = Store.get();
    const cfg = st.datos.config.umbrales || Modelo.configInicial();
    const tablas = poligonos.map(p => Modelo.nuevaTabla({ codigo: p.nombre.slice(0, 40), nombre: p.nombre, superficie_ha: Math.round(Geo.areaHa(p.anillo) * 100) / 100,
      variedad: p.variedad || '', geometria: { type: 'Polygon', coordinates: [p.anillo] }, origen }));
    const c = Geo.centroide(poligonos.flatMap(p => p.anillo));
    cfg.rancho_lon = +c[0].toFixed(5); cfg.rancho_lat = +c[1].toFixed(5);
    let usuarios = vivos(st.datos.usuarios);
    if (!usuarios.length) usuarios = [Modelo.nuevoUsuario({ nombre: 'Propietario', rol: 'administrador' }), Modelo.nuevoUsuario({ nombre: 'Operador 1', rol: 'operador' }), Modelo.nuevoUsuario({ nombre: 'Operador 2', rol: 'operador' })];
    Store.put('config', cfg);
    Store.putMuchos('usuarios', usuarios);
    Store.putMuchos('tablas', tablas);
    if (demo) {
      const g = Demo.generar(Store.get().datos, cfg);
      Store.putMuchos('clima', g.clima); Store.putMuchos('recorridos', g.recorridos); Store.putMuchos('evaluaciones', g.evaluaciones); Store.putMuchos('aplicaciones', g.aplicaciones);
    }
    setOcupado(false);
  }
  async function importar(e) {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try { const p = await Geo.leer(f); await crear(p, 'kmz'); }
    catch (err) { setMsg(err.message); }
  }
  return html`<div className="bienvenida">
    <div className="marca"><span className="marca-hoja"></span>Monitoreo de Sigatoka negra</div>
    <h1>Configura el rancho</h1>
    <p>Primero carga las tablas (lotes) con sus polígonos. Después podrás crear recorridos y capturar plantas con el método de Stover modificado.</p>
    ${msg && html`<div className="error">${msg}</div>`}
    <div className="caja" style=${{ margin: '18px 0' }}>
      <h2>Tablas del rancho</h2>
      <p className="peq muted">Sube el archivo .kmz o .kml exportado de Google Earth. Cada polígono se convierte en una tabla con su superficie calculada.</p>
      <input ref=${inp} type="file" accept=".kmz,.kml" hidden onChange=${importar} />
      <div className="fila-btn" style=${{ marginTop: 10 }}>
        <button className="btn btn-p" disabled=${ocupado} onClick=${() => inp.current.click()}>Importar KMZ o KML</button>
        <button className="btn" disabled=${ocupado} onClick=${() => crear(Geo.catalogoEjemplo(), 'ejemplo')}>Usar 12 tablas de ejemplo</button>
      </div>
    </div>
    <label className="interruptor"><input type="checkbox" checked=${demo} onChange=${e => setDemo(e.target.checked)} />Agregar 16 semanas de datos de demostración (recorridos, aplicaciones y clima simulado)</label>
    <p className="peq muted">Se crean tres usuarios de prueba: Propietario (administrador), Operador 1 y Operador 2. Puedes renombrarlos en Administración.</p>
  </div>`;
}

/* ---------- Componentes de captura ---------- */
function Stepper({ valor, min = 0, max = 99, onCambio, etiqueta }) {
  return html`<div className="stepper" role="group" aria-label=${etiqueta}>
    <button aria-label=${'Restar ' + etiqueta} onClick=${() => onCambio(Math.max(min, (valor || 0) - 1))} disabled=${valor <= min}>−</button>
    <output className="num">${valor == null ? '—' : valor}</output>
    <button aria-label=${'Sumar ' + etiqueta} onClick=${() => onCambio(Math.min(max, (valor || 0) + 1))} disabled=${valor >= max}>+</button>
  </div>`;
}
function SelectorHoja({ titulo, valor, th, onCambio }) {
  const n = Math.max(th, valor || 0);
  return html`<div className="sintoma">
    <div className="cab"><span className="tit" style=${{ fontWeight: 700 }}>${titulo}</span>
      <span className="peq ${valor == null ? '' : 'muted'}" style=${{ color: valor == null ? 'var(--aviso)' : undefined, fontWeight: 700 }}>
        ${valor == null ? 'Sin capturar' : valor === 0 ? 'No presenta' : 'Hoja ' + valor}</span></div>
    <div className="chips">
      <button className=${'chip np' + (valor === 0 ? ' activo' : '')} onClick=${() => onCambio(0)}>No presenta</button>
      ${Array.from({ length: n }, (_, i) => i + 1).map(h => html`<button key=${h} className=${'chip num' + (valor === h ? ' activo' : '')}
        style=${h > th ? { borderColor: 'var(--error)', color: 'var(--error)' } : null} onClick=${() => onCambio(h)}>${h}</button>`)}
    </div>
  </div>`;
}
function TiraHojas({ planta, onClic }) {
  return html`<div className="tira">${planta.hojas.map((h, i) => html`<span key=${h.id} onClick=${onClic ? () => onClic(i) : null}
    className=${'cuad ' + (h.grado_gauhl == null ? 'vacio' : 'gc' + h.grado_gauhl)} title=${'Hoja ' + h.numero_hoja}>${h.grado_gauhl == null ? h.numero_hoja : h.grado_gauhl}</span>`)}</div>`;
}

function ModalHojas({ planta, tabla, onGrado, onCerrar }) {
  const primeraVacia = planta.hojas.findIndex(h => h.grado_gauhl == null);
  const [i, setI] = useState(primeraVacia >= 0 ? primeraVacia : 0);
  const [fin, setFin] = useState(false);
  const lista = useRef(null);
  const total = planta.hojas.length;
  const hoja = planta.hojas[i];
  useEffect(() => { const el = lista.current && lista.current.querySelector('.actual'); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, [i]);
  function elegir(g) {
    onGrado(i, g);
    const sig = planta.hojas.findIndex((h, j) => j > i && h.grado_gauhl == null);
    if (i < total - 1) setI(sig > i ? sig : i + 1);
    else setFin(true);
  }
  useEffect(() => {
    const k = e => { if (/^[0-6]$/.test(e.key)) elegir(Number(e.key)); else if (e.key === 'ArrowUp') setI(Math.max(0, i - 1)); else if (e.key === 'ArrowDown') setI(Math.min(total - 1, i + 1)); else if (e.key === 'Escape') onCerrar(); };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  });
  const hfV = Calc.hf(planta), iiV = Calc.iiPlanta(planta), faltan = planta.hojas.filter(h => h.grado_gauhl == null).length;
  return html`<div className="modal" role="dialog" aria-modal="true" aria-label="Calificar hojas">
    <div className="modal-cab">
      <button className="volver" onClick=${onCerrar}>${Icono.atras}Planta ${planta.numero_planta}</button>
      <div style=${{ marginLeft: 'auto', textAlign: 'right' }}>
        <div style=${{ fontWeight: 700, fontSize: '1.15rem' }}>Hoja ${hoja ? hoja.numero_hoja : '—'} de ${total}</div>
        <div className="peq muted">${tabla ? tabla.codigo : ''}: HF ${hfV}, II ${fmt(iiV)}${faltan ? `, faltan ${faltan}` : ''}</div>
      </div>
    </div>
    <div className="modal-cuerpo" ref=${lista}>
      <p className="peq muted" style=${{ textAlign: 'center', margin: '0 0 8px' }}>Hoja 1 = la más joven completamente abierta (sin contar el cigarro)</p>
      <div className="planta">
        ${planta.hojas.map((h, j) => html`<button key=${h.id} className=${'hoja-f ' + (j % 2 ? 'der' : 'izq') + (j === i && !fin ? ' actual' : '')}
          onClick=${() => { setI(j); setFin(false); }} aria-label=${`Hoja ${h.numero_hoja}, ${h.grado_gauhl == null ? 'sin calificar' : 'grado ' + h.grado_gauhl}`}>
          <span className=${'lam ' + (h.grado_gauhl == null ? 'vacia' : 'gc' + h.grado_gauhl)}></span>
          <span className="n num">${h.numero_hoja}${h.grado_gauhl != null ? '·' + h.grado_gauhl : ''}</span>
        </button>`)}
      </div>
    </div>
    <div className="modal-pie">
      ${fin ? html`<div style=${{ textAlign: 'center' }}>
          <p style=${{ fontSize: '1.1rem', fontWeight: 700 }}>${faltan ? `Faltan ${faltan} hoja(s) por calificar` : 'Todas las hojas calificadas'}</p>
          <p className="muted">Hojas funcionales: <b>${hfV}</b> · Índice de infección: <b>${fmt(iiV)} %</b></p>
          <div className="fila-btn"><button className="btn" onClick=${() => { setFin(false); setI(total - 1); }}>Revisar hojas</button>
          <button className="btn btn-p" onClick=${onCerrar}>Volver a la planta</button></div>
        </div>`
      : html`<div className="grados">
          ${Calc.GRADOS.map(g => html`<button key=${g.g} className=${'grado gc' + g.g + (hoja && hoja.grado_gauhl === g.g ? ' sel' : '')} onClick=${() => elegir(g.g)} aria-label=${`Grado ${g.g}: ${g.rango}`}>
            <b>${g.g}</b><small>${g.rango}</small></button>`)}
          <button className="grado" style=${{ background: 'var(--bg)', color: 'var(--ink)', borderColor: 'var(--ink)' }} disabled=${i === 0} onClick=${() => setI(i - 1)}><b style=${{ fontSize: '1.3rem' }}>↑</b><small>Hoja anterior</small></button>
          <div className="sep-func"><span>0–4 funcionales</span><span>5–6 no funcionales</span></div>
        </div>`}
    </div>
  </div>`;
}

/* ---------- Pantallas de campo ---------- */
function puedeEditarRecorrido(rec, usuario) {
  if (!rec || !usuario) return false;
  if (usuario.rol === 'administrador') return true;
  return rec.usuario_id === usuario.id && rec.estado === 'en_curso';
}
function EtqEstado({ estado, pendiente }) {
  if (estado === 'en_curso') return html`<span className="etq e-curso">En curso</span>`;
  if (estado === 'cerrado' || pendiente) return html`<span className="etq e-cerrado">Cerrado, por enviar</span>`;
  return html`<span className="etq e-sinc">Sincronizado</span>`;
}

function ListaRecorridos({ usuario, ir }) {
  const st = useStore();
  const esAdmin = usuario.rol === 'administrador';
  const [verTodos, setVerTodos] = useState(false);
  let recs = vivos(st.datos.recorridos).sort((a, b) => b.fecha.localeCompare(a.fecha) || b.created_at.localeCompare(a.created_at));
  if (!esAdmin) recs = recs.filter(r => r.usuario_id === usuario.id && r.estado === 'en_curso');
  const abiertos = recs.filter(r => r.estado === 'en_curso');
  const cerrados = recs.filter(r => r.estado !== 'en_curso');
  const evs = vivos(st.datos.evaluaciones);
  const tarjeta = r => {
    const e = evs.filter(x => x.recorrido_id === r.id);
    const np = e.reduce((s, x) => s + x.plantas.length, 0);
    const u = st.datos.usuarios[r.usuario_id];
    return html`<li key=${r.id}><button className="item" onClick=${() => ir({ vista: 'recorrido', recorridoId: r.id })}>
      <div><div style=${{ fontWeight: 700 }}>${fechaCorta(r.fecha)} <span className="muted">(${etqSem(r.semana_iso)})</span></div>
      <div className="peq muted">${u ? u.nombre : 'Usuario'}: ${e.length} tabla${e.length !== 1 ? 's' : ''}, ${np} plantas</div></div>
      <div className="der"><${EtqEstado} estado=${r.estado} pendiente=${st.pendientes['recorridos/' + r.id]} /></div>
    </button></li>`;
  };
  return html`<div>
    <h1>Recorridos</h1>
    <p className="muted">${esAdmin ? 'Como administrador ves y corriges los recorridos de todos.' : 'Tus recorridos abiertos.'}</p>
    <button className="btn btn-p btn-b" style=${{ margin: '14px 0' }} onClick=${() => ir({ vista: 'nuevo' })}>Nuevo recorrido</button>
    ${abiertos.length ? html`<ul className="lista">${abiertos.map(tarjeta)}</ul>`
      : html`<div className="caja vacio-panel">${esAdmin ? 'No hay recorridos abiertos.' : 'No tienes recorridos abiertos. Crea uno para empezar a capturar.'}</div>`}
    ${esAdmin && cerrados.length > 0 && html`<div className="seccion">
      <h2 style=${{ margin: '18px 0 10px' }}>Cerrados</h2>
      <ul className="lista">${(verTodos ? cerrados : cerrados.slice(0, 6)).map(tarjeta)}</ul>
      ${cerrados.length > 6 && html`<button className="enlace" onClick=${() => setVerTodos(!verTodos)}>${verTodos ? 'Ver menos' : `Ver los ${cerrados.length} recorridos cerrados`}</button>`}
    </div>`}
  </div>`;
}

function SelectorTablas({ tablas, sel, onCambio, deshabilitadas = [] }) {
  return html`<div className="chips">${ordenarTablas(tablas).map(t => {
    const on = sel.includes(t.id), off = deshabilitadas.includes(t.id);
