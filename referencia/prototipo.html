      onClick=${() => onCambio(on ? sel.filter(x => x !== t.id) : [...sel, t.id])}>${t.codigo}</button>`;
  })}</div>`;
}

function NuevoRecorrido({ usuario, ir }) {
  const st = useStore();
  const [fecha, setFecha] = useState(Modelo.hoy());
  const [sel, setSel] = useState([]);
  const tablas = vivos(st.datos.tablas).filter(t => t.activa);
  function iniciar() {
    const rec = Store.put('recorridos', Modelo.nuevoRecorrido({ fecha, usuario_id: usuario.id }));
    Store.putMuchos('evaluaciones', ordenarTablas(tablas.filter(t => sel.includes(t.id))).map(t => Modelo.nuevaEvaluacion({ recorrido_id: rec.id, tabla_id: t.id })));
    ir({ vista: 'recorrido', recorridoId: rec.id }, true);
  }
  return html`<div>
    <div className="migas"><button className="volver" onClick=${() => ir({ vista: 'lista' })}>${Icono.atras}Recorridos</button></div>
    <h1>Nuevo recorrido</h1>
    <label className="campo"><span>Fecha</span><input className="inp" type="date" value=${fecha} max=${Modelo.hoy()} onChange=${e => setFecha(e.target.value || Modelo.hoy())} /></label>
    <p className="peq muted">Semana ${etqSem(Modelo.semanaISO(fecha))}, operador: ${usuario.nombre}</p>
    <h2 style=${{ margin: '18px 0 6px' }}>Tablas a evaluar</h2>
    <p className="peq muted">Elige una o varias. Puedes agregar más durante el recorrido.</p>
    <${SelectorTablas} tablas=${tablas} sel=${sel} onCambio=${setSel} />
    <div className="fila-btn" style=${{ marginTop: 10 }}><button className="enlace" onClick=${() => setSel(sel.length === tablas.length ? [] : tablas.map(t => t.id))}>${sel.length === tablas.length ? 'Quitar todas' : 'Seleccionar todas'}</button></div>
    <button className="btn btn-p btn-b" style=${{ marginTop: 18 }} disabled=${!sel.length} onClick=${iniciar}>Iniciar recorrido${sel.length ? ` (${sel.length} tabla${sel.length > 1 ? 's' : ''})` : ''}</button>
  </div>`;
}

function VistaRecorrido({ usuario, nav, ir }) {
  const st = useStore();
  const rec = st.datos.recorridos[nav.recorridoId];
  const [agregar, setAgregar] = useState(false);
  const [selNuevas, setSelNuevas] = useState([]);
  if (!rec || rec.eliminado) return html`<div><p>El recorrido ya no existe.</p><button className="btn" onClick=${() => ir({ vista: 'lista' })}>Volver</button></div>`;
  const editable = puedeEditarRecorrido(rec, usuario);
  const evs = ordenarTablas(vivos(st.datos.evaluaciones).filter(e => e.recorrido_id === rec.id).map(e => ({ ...e, codigo: (st.datos.tablas[e.tabla_id] || {}).codigo || '?' })));
  const u = st.datos.usuarios[rec.usuario_id];
  const tablasAct = vivos(st.datos.tablas).filter(t => t.activa);
  const total = Calc.resumen(evs.flatMap(e => e.plantas));
  async function cerrar() {
    const vacias = evs.filter(e => !e.plantas.length).length;
    const incompletas = evs.flatMap(e => e.plantas).filter(p => !Calc.completa(p)).length;
    let msg = 'Ya no podrás editarlo desde el celular del operador.';
    if (vacias) msg += `\n\n${vacias} tabla(s) sin plantas capturadas.`;
    if (incompletas) msg += `\n${incompletas} planta(s) con hojas sin calificar.`;
    if (!(await confirmar(msg, { titulo: '¿Cerrar el recorrido?', aceptar: 'Cerrar recorrido' }))) return;
    evs.forEach(e => { if (e.plantas.length && !e.hora_fin) Store.put('evaluaciones', { ...st.datos.evaluaciones[e.id], hora_fin: Modelo.ahora() }); });
    Store.put('recorridos', { ...rec, estado: 'cerrado' });
    avisar('Recorrido cerrado');
    ir({ vista: 'lista' });
  }
  function agregarTablas() {
    Store.putMuchos('evaluaciones', selNuevas.map(id => Modelo.nuevaEvaluacion({ recorrido_id: rec.id, tabla_id: id })));
    setSelNuevas([]); setAgregar(false);
  }
  return html`<div>
    <div className="migas"><button className="volver" onClick=${() => ir({ vista: 'lista' })}>${Icono.atras}Recorridos</button></div>
    <div style=${{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
      <div style=${{ flex: 1 }}><h1>Recorrido del ${fechaSinAnio(rec.fecha)}</h1>
      <p className="muted">Semana ${etqSem(rec.semana_iso)}, ${u ? u.nombre : ''}</p></div>
      <${EtqEstado} estado=${rec.estado} pendiente=${st.pendientes['recorridos/' + rec.id]} />
    </div>
    <div className="kpis" style=${{ margin: '12px 0' }}>
      <div className="kpi"><b className="num">${total.n}</b><span>plantas</span></div>
      <div className="kpi"><b className="num">${fmt(total.ii)}</b><span>II del recorrido (%)</span></div>
      <div className="kpi"><b className="num">${fmt(total.hf)}</b><span>HF promedio</span></div>
    </div>
    <ul className="lista">${evs.map(e => {
      const r = Calc.resumen(e.plantas);
      const estado = e.hora_fin ? 'Terminada' : e.plantas.length ? 'En captura' : 'Sin iniciar';
      return html`<li key=${e.id}><button className="item" onClick=${() => ir({ vista: 'tabla', recorridoId: rec.id, evaluacionId: e.id })}>
        <div><div style=${{ fontWeight: 700, fontSize: '1.15rem' }}>${e.codigo}</div><div className="peq muted">${estado}${e.plantas.length ? `: ${r.n} plantas, II ${fmt(r.ii)}` : ''}</div></div>
        <div className="der num" style=${{ fontSize: '1.4rem', fontWeight: 700 }}>${e.plantas.length}<div className="peq muted" style=${{ fontWeight: 400 }}>plantas</div></div>
      </button></li>`;
    })}</ul>
    ${editable && html`<div className="seccion">
      ${agregar ? html`<div className="caja">
          <h3>Agregar tablas</h3>
          <div style=${{ margin: '10px 0' }}><${SelectorTablas} tablas=${tablasAct} sel=${selNuevas} onCambio=${setSelNuevas} deshabilitadas=${evs.map(e => e.tabla_id)} /></div>
          <div className="fila-btn"><button className="btn" onClick=${() => setAgregar(false)}>Cancelar</button><button className="btn btn-p" disabled=${!selNuevas.length} onClick=${agregarTablas}>Agregar</button></div>
        </div>`
      : html`<div className="fila-btn">
          <button className="btn" onClick=${() => setAgregar(true)}>Agregar tabla</button>
          ${rec.estado === 'en_curso' && html`<button className="btn btn-p" onClick=${cerrar}>Cerrar recorrido</button>`}
        </div>`}
      ${usuario.rol === 'administrador' && html`<div className="fila-btn" style=${{ marginTop: 10 }}>
        ${rec.estado !== 'en_curso' && html`<button className="btn btn-q" onClick=${() => { Store.put('recorridos', { ...rec, estado: 'en_curso' }); avisar('Recorrido reabierto'); }}>Reabrir recorrido</button>`}
        <button className="btn btn-x" onClick=${async () => { if (await confirmar('Se eliminan también todas sus evaluaciones y plantas.', { titulo: '¿Eliminar este recorrido?', aceptar: 'Eliminar', peligro: true })) { evs.forEach(e => Store.eliminar('evaluaciones', e.id)); Store.eliminar('recorridos', rec.id); ir({ vista: 'lista' }); } }}>Eliminar recorrido</button>
      </div>`}
    </div>`}
    ${!editable && html`<div className="info">Este recorrido está cerrado. Solo el administrador puede corregirlo.</div>`}
  </div>`;
}

function VistaTabla({ usuario, nav, ir }) {
  const st = useStore();
  const ev = st.datos.evaluaciones[nav.evaluacionId];
  const rec = ev && st.datos.recorridos[ev.recorrido_id];
  if (!ev || ev.eliminado || !rec) return html`<div><p>La evaluación ya no existe.</p><button className="btn" onClick=${() => ir({ vista: 'lista' })}>Volver</button></div>`;
  const tabla = st.datos.tablas[ev.tabla_id] || {};
  const editable = puedeEditarRecorrido(rec, usuario);
  const r = Calc.resumen(ev.plantas);
  const plantas = ev.plantas.slice().sort((a, b) => a.numero_planta - b.numero_planta);
  function nueva() {
    const previa = plantas[plantas.length - 1];
    const num = plantas.length ? Math.max(...plantas.map(p => p.numero_planta)) + 1 : 1;
    const p = Modelo.nuevaPlanta(ev.id, num, previa);
    Store.put('evaluaciones', { ...ev, hora_inicio: ev.hora_inicio || Modelo.ahora(), plantas: [...ev.plantas, p] });
    ir({ ...nav, vista: 'planta', plantaId: p.id, abrirHojas: false });
  }
  return html`<div>
    <div className="migas"><button className="volver" onClick=${() => ir({ vista: 'recorrido', recorridoId: rec.id })}>${Icono.atras}Recorrido del ${fechaSinAnio(rec.fecha)}</button></div>
    <h1>Tabla ${tabla.codigo}</h1>
    <p className="muted">${tabla.variedad || ''}${tabla.superficie_ha ? `, ${fmt(tabla.superficie_ha, 2)} ha` : ''}${ev.hora_inicio ? `, inicio ${horaCorta(ev.hora_inicio)}` : ''}${ev.hora_fin ? `, fin ${horaCorta(ev.hora_fin)}` : ''}</p>
    <div className="kpis" style=${{ margin: '12px 0' }}>
      <div className="kpi"><b className="num">${r.n}</b><span>plantas (lo normal: 18–20)</span></div>
      <div className="kpi"><b className="num">${fmt(r.ii)}</b><span>II (%)</span></div>
      <div className="kpi"><b className="num">${fmt(r.th)}</b><span>TH promedio</span></div>
      <div className="kpi"><b className="num">${fmt(r.hf)}</b><span>HF promedio</span></div>
    </div>
    ${editable && html`<button className="btn btn-p btn-b" style=${{ margin: '6px 0 14px' }} onClick=${nueva}>Nueva planta (nº ${plantas.length ? Math.max(...plantas.map(p => p.numero_planta)) + 1 : 1})</button>`}
    <ul className="lista">${plantas.slice().reverse().map(p => {
      const ok = Calc.completa(p); const v = Calc.validar(p);
      return html`<li key=${p.id}><button className="item" onClick=${() => ir({ ...nav, vista: 'planta', plantaId: p.id })}>
        <div style=${{ fontSize: '1.4rem', fontWeight: 700, minWidth: 44 }} className="num">${p.numero_planta}</div>
        <div style=${{ minWidth: 0 }}><div className="peq">TH ${p.total_hojas}, HF ${Calc.hf(p)}, II ${fmt(Calc.iiPlanta(p))}</div>
          <div className="peq" style=${{ color: v.errores.length ? 'var(--error)' : ok ? 'var(--ink-2)' : 'var(--aviso)', fontWeight: 700 }}>${v.errores.length ? 'Revisar datos' : ok ? 'Completa' : 'Incompleta'}</div></div>
        <div className="der" style=${{ maxWidth: '45%' }}><${TiraHojas} planta=${p} /></div>
      </button></li>`;
    })}</ul>
    ${!plantas.length && html`<div className="caja vacio-panel">Aún no hay plantas. Elige una planta parida y captúrala.</div>`}
    ${editable && plantas.length > 0 && html`<button className="btn btn-b" style=${{ marginTop: 16 }} onClick=${() => { Store.put('evaluaciones', { ...ev, hora_fin: Modelo.ahora() }); avisar(`Tabla ${tabla.codigo} terminada`); ir({ vista: 'recorrido', recorridoId: rec.id }); }}>Terminar tabla</button>`}
  </div>`;
}

function VistaPlanta({ usuario, nav, ir }) {
  const st = useStore();
  const ev = st.datos.evaluaciones[nav.evaluacionId];
  const rec = ev && st.datos.recorridos[ev.recorrido_id];
  const p = ev && ev.plantas.find(x => x.id === nav.plantaId);
  const [modal, setModal] = useState(!!nav.abrirHojas);
  const [gpsMsg, setGpsMsg] = useState(null);
  if (!ev || !p || !rec) return html`<div><p>La planta ya no existe.</p><button className="btn" onClick=${() => ir({ vista: 'lista' })}>Volver</button></div>`;
  const tabla = st.datos.tablas[ev.tabla_id] || {};
  const editable = puedeEditarRecorrido(rec, usuario);
  const v = Calc.validar(p);
  const ordenadas = ev.plantas.slice().sort((a, b) => a.numero_planta - b.numero_planta);
  const pos = ordenadas.findIndex(x => x.id === p.id);
  function actualizar(cambios) {
    if (!editable) return;
    const actual = Store.get().datos.evaluaciones[ev.id];
    const plantas = actual.plantas.map(x => {
      if (x.id !== p.id) return x;
      const n = { ...x, ...cambios, updated_at: Modelo.ahora() };
      if (cambios.total_hojas != null) n.hojas = Modelo.ajustarHojas(n, cambios.total_hojas);
      return n;
    });
    Store.put('evaluaciones', { ...actual, plantas });
  }
  function setGrado(idx, g) {
    const actual = Store.get().datos.evaluaciones[ev.id];
    const x = actual.plantas.find(y => y.id === p.id);
    const hojas = x.hojas.map((h, j) => j === idx ? { ...h, grado_gauhl: g } : h);
    actualizar({ hojas });
  }
  async function siguiente() {
    if (v.errores.length) { avisar('Corrige los datos marcados en rojo'); return; }
    const faltan = p.hojas.filter(h => h.grado_gauhl == null).length;
    if (faltan && !(await confirmar('¿Pasar a la siguiente planta de todos modos?', { titulo: `Faltan ${faltan} hoja(s) por calificar`, aceptar: 'Pasar a la siguiente', cancelar: 'Seguir calificando' }))) return;
    if (pos < ordenadas.length - 1) { ir({ ...nav, plantaId: ordenadas[pos + 1].id, abrirHojas: false }); return; }
    const actual = Store.get().datos.evaluaciones[ev.id];
    const num = Math.max(...actual.plantas.map(x => x.numero_planta)) + 1;
    const n = Modelo.nuevaPlanta(ev.id, num, p);
    Store.put('evaluaciones', { ...actual, plantas: [...actual.plantas, n] });
    ir({ ...nav, plantaId: n.id, abrirHojas: false });
    window.scrollTo(0, 0);
  }
  async function borrar() {
    if (!(await confirmar('Se borran sus datos y la calificación de sus hojas.', { titulo: `¿Eliminar la planta ${p.numero_planta}?`, aceptar: 'Eliminar', peligro: true }))) return;
    const actual = Store.get().datos.evaluaciones[ev.id];
    Store.put('evaluaciones', { ...actual, plantas: actual.plantas.filter(x => x.id !== p.id) });
    ir({ ...nav, vista: 'tabla', plantaId: null });
  }
  function gps() {
    if (!navigator.geolocation) { setGpsMsg('Este dispositivo no permite obtener la ubicación.'); return; }
    setGpsMsg('Obteniendo ubicación…');
    navigator.geolocation.getCurrentPosition(
      pos => { actualizar({ gps: { lat: +pos.coords.latitude.toFixed(6), lon: +pos.coords.longitude.toFixed(6), precision_m: Math.round(pos.coords.accuracy) } }); setGpsMsg(null); },
      () => setGpsMsg('No se pudo obtener la ubicación. Revisa el permiso de ubicación.'), { enableHighAccuracy: true, timeout: 15000 });
  }
  const faltan = p.hojas.filter(h => h.grado_gauhl == null).length;
  return html`<div style=${{ paddingBottom: editable ? 80 : 0 }}>
    <div className="migas"><button className="volver" onClick=${() => ir({ ...nav, vista: 'tabla', plantaId: null })}>${Icono.atras}Tabla ${tabla.codigo}</button>
      <span className="muted peq" style=${{ marginLeft: 'auto' }}>Planta ${pos + 1} de ${ordenadas.length}</span></div>
    ${!editable && html`<div className="info">Solo lectura: el recorrido está cerrado.</div>`}
    <div className="paso"><div><div className="tit">Número de planta</div><div className="sub">Consecutivo en la tabla</div></div>
      <${Stepper} etiqueta="número de planta" valor=${p.numero_planta} min=${1} max=${200} onCambio=${n => actualizar({ numero_planta: n })} /></div>
    <div className="paso"><div><div className="tit">Total de hojas (TH)</div><div className="sub">Todas las hojas en pie, incluidas las muy dañadas</div></div>
      <${Stepper} etiqueta="total de hojas" valor=${p.total_hojas} min=${1} max=${25} onCambio=${n => actualizar({ total_hojas: n })} /></div>
    <${SelectorHoja} titulo="Hoja más joven con pizca" valor=${p.hmj_pizca} th=${p.total_hojas} onCambio=${n => actualizar({ hmj_pizca: n })} />
    <${SelectorHoja} titulo="Hoja más joven con estría" valor=${p.hmj_estria} th=${p.total_hojas} onCambio=${n => actualizar({ hmj_estria: n })} />
    <${SelectorHoja} titulo="Hoja más joven con mancha o quema" valor=${p.hmj_mancha} th=${p.total_hojas} onCambio=${n => actualizar({ hmj_mancha: n })} />
    <div className="sintoma">
      <div className="cab"><span style=${{ fontWeight: 700 }}>Severidad por hoja (Gauhl)</span><span className="peq muted">HF ${Calc.hf(p)}, II ${fmt(Calc.iiPlanta(p))}</span></div>
      <${TiraHojas} planta=${p} onClic=${editable ? () => setModal(true) : null} />
      ${editable && html`<button className=${'btn btn-b ' + (faltan ? 'btn-p' : '')} style=${{ marginTop: 10 }} onClick=${() => setModal(true)}>${faltan === p.hojas.length ? `Calificar las ${p.total_hojas} hojas` : faltan ? `Calificar hojas (faltan ${faltan})` : 'Revisar calificación de hojas'}</button>`}
    </div>
    ${v.errores.length > 0 && html`<div className="error"><ul>${v.errores.map((e, i) => html`<li key=${i}>${e}</li>`)}</ul></div>`}
    ${v.avisos.length > 0 && html`<div className="aviso"><ul>${v.avisos.map((e, i) => html`<li key=${i}>${e}</li>`)}</ul></div>`}
    <label className="campo"><span>Observaciones</span>
      <textarea className="inp" disabled=${!editable} value=${p.observaciones} placeholder="Opcional" onChange=${e => actualizar({ observaciones: e.target.value })}></textarea></label>
    <div style=${{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
      ${editable && html`<button className="btn btn-s btn-q" onClick=${gps}>${p.gps ? 'Actualizar ubicación' : 'Agregar ubicación GPS'}</button>`}
      <span className="peq muted">${gpsMsg || (p.gps ? `${p.gps.lat}, ${p.gps.lon} (±${p.gps.precision_m} m)` : 'Ubicación opcional')}</span>
    </div>
    ${editable && html`<button className="enlace" style=${{ color: 'var(--error)', marginTop: 12 }} onClick=${borrar}>Eliminar esta planta</button>`}
    ${editable && html`<div className="pie-fijo"><div>
      <button className="btn" style=${{ flex: '0 0 auto' }} disabled=${pos <= 0} onClick=${() => ir({ ...nav, plantaId: ordenadas[pos - 1].id })} aria-label="Planta anterior">${Icono.atras}</button>
      <button className="btn btn-p" style=${{ flex: 1 }} onClick=${siguiente}>${pos < ordenadas.length - 1 ? 'Siguiente planta' : 'Guardar y nueva planta'}</button>
    </div></div>`}
    ${modal && html`<${ModalHojas} planta=${p} tabla=${tabla} onGrado=${setGrado} onCerrar=${() => setModal(false)} />`}
  </div>`;
}

function Campo({ usuario }) {
  const [nav, setNav] = usePref('nav', { vista: 'lista' });
  const ir = useCallback((n) => { setNav(n); window.scrollTo(0, 0); }, [setNav]);
  const st = useStore();
  let n = nav || { vista: 'lista' };
  if (n.recorridoId) { const r = st.datos.recorridos[n.recorridoId]; if (!r || (usuario.rol !== 'administrador' && r.usuario_id !== usuario.id)) n = { vista: 'lista' }; }
  if (n.vista === 'nuevo') return html`<${NuevoRecorrido} usuario=${usuario} ir=${ir} />`;
  if (n.vista === 'recorrido') return html`<${VistaRecorrido} usuario=${usuario} nav=${n} ir=${ir} />`;
  if (n.vista === 'tabla') return html`<${VistaTabla} usuario=${usuario} nav=${n} ir=${ir} />`;
  if (n.vista === 'planta') return html`<${VistaPlanta} key=${n.plantaId} usuario=${usuario} nav=${n} ir=${ir} />`;
  return html`<${ListaRecorridos} usuario=${usuario} ir=${ir} />`;
}

/* ---------- Aplicaciones ---------- */
const FRAC = [['M03', 'Ditiocarbamatos (mancozeb)'], ['M05', 'Cloronitrilos (clorotalonil)'], ['1', 'Bencimidazoles'], ['3', 'Triazoles / DMI'], ['5', 'Aminas / morfolinas'],
  ['7', 'SDHI'], ['9', 'Anilinopirimidinas'], ['11', 'Estrobilurinas / QoI'], ['BM02', 'Biológico'], ['Aceite', 'Aceite agrícola']];
const METODOS = ['Aérea', 'Terrestre', 'Motobomba', 'Aspersora de mochila', 'Dron', 'Otro'];
const UNIDADES = ['L/ha', 'mL/ha', 'kg/ha', 'g/ha', 'L/200 L', 'mL/L'];

function FormAplicacion({ inicial, usuario, onCerrar }) {
  const st = useStore();
  const [a, setA] = useState(() => inicial || Modelo.nuevaAplicacion({ usuario_id: usuario.id, responsable: usuario.nombre }));
  const tablas = vivos(st.datos.tablas).filter(t => t.activa || a.tabla_ids.includes(t.id));
  const set = (k, v) => setA(x => ({ ...x, [k]: v }));
  const repetidas = a.grupo_frac ? a.tabla_ids.map(id => {
    const prev = Analisis.aplicacionesDeTabla(st.datos, id).filter(x => x.id !== a.id && x.fecha <= a.fecha).pop();
    return prev && prev.grupo_frac === a.grupo_frac ? { t: st.datos.tablas[id], prev } : null;
  }).filter(Boolean) : [];
  const valido = a.fecha && a.tabla_ids.length && a.producto.trim();
  function guardar() { Store.put('aplicaciones', { ...a, dosis: a.dosis === '' ? null : a.dosis, volumen_mezcla: a.volumen_mezcla === '' ? null : a.volumen_mezcla }); avisar(inicial ? 'Aplicación actualizada' : 'Aplicación registrada'); onCerrar(); }
  return html`<div className="velo" onClick=${e => { if (e.target === e.currentTarget) onCerrar(); }}>
    <div className="hoja-sheet" role="dialog" aria-modal="true" aria-label="Aplicación de fungicida">
      <h2>${inicial ? 'Editar aplicación' : 'Registrar aplicación'}</h2>
      <label className="campo"><span>Fecha</span><input className="inp" type="date" value=${a.fecha} onChange=${e => set('fecha', e.target.value)} /></label>
      <div className="campo"><span style=${{ fontWeight: 700, display: 'block', marginBottom: 6 }}>Tablas aplicadas</span>
        <${SelectorTablas} tablas=${tablas} sel=${a.tabla_ids} onCambio=${v => set('tabla_ids', v)} />
        <button className="enlace" onClick=${() => set('tabla_ids', a.tabla_ids.length === tablas.length ? [] : tablas.map(t => t.id))}>${a.tabla_ids.length === tablas.length ? 'Quitar todas' : 'Todas las tablas'}</button></div>
      <label className="campo"><span>Producto comercial</span><input className="inp" list="lista-prod" value=${a.producto} onChange=${e => {
        const v = e.target.value; const pr = Demo.PRODUCTOS.find(x => x.producto === v);
        setA(x => pr ? { ...x, producto: v, ingrediente_activo: x.ingrediente_activo || pr.ia, grupo_frac: x.grupo_frac || pr.frac, unidad: pr.unidad } : { ...x, producto: v });
      }} /></label>
      <datalist id="lista-prod">${[...new Set([...Demo.PRODUCTOS.map(p => p.producto), ...vivos(st.datos.aplicaciones).map(x => x.producto)])].map(p => html`<option key=${p} value=${p} />`)}</datalist>
      <div className="rejilla2">
        <label className="campo"><span>Ingrediente activo</span><input className="inp" value=${a.ingrediente_activo} onChange=${e => set('ingrediente_activo', e.target.value)} /></label>
        <label className="campo"><span>Grupo FRAC / modo de acción</span><input className="inp" list="lista-frac" value=${a.grupo_frac} onChange=${e => set('grupo_frac', e.target.value.trim())} /></label>
      </div>
      <datalist id="lista-frac">${FRAC.map(([c, n]) => html`<option key=${c} value=${c}>${n}</option>`)}</datalist>
      ${repetidas.length > 0 && html`<div className="aviso">Mismo grupo FRAC (${a.grupo_frac}) que la aplicación anterior en: ${repetidas.map(r => `${r.t ? r.t.codigo : '?'} (${fechaSinAnio(r.prev.fecha)})`).join(', ')}. Considera rotar el modo de acción.</div>`}
      <div className="rejilla2">
        <label className="campo"><span>Dosis</span><input className="inp" type="number" inputmode="decimal" step="any" value=${a.dosis ?? ''} onChange=${e => set('dosis', e.target.value === '' ? '' : Number(e.target.value))} /></label>
        <label className="campo"><span>Unidad</span><select className="inp" value=${a.unidad} onChange=${e => set('unidad', e.target.value)}>${UNIDADES.map(u => html`<option key=${u}>${u}</option>`)}</select></label>
        <label className="campo"><span>Volumen de mezcla (L/ha)</span><input className="inp" type="number" inputmode="decimal" step="any" value=${a.volumen_mezcla ?? ''} onChange=${e => set('volumen_mezcla', e.target.value === '' ? '' : Number(e.target.value))} /></label>
        <label className="campo"><span>Método</span><select className="inp" value=${a.metodo} onChange=${e => set('metodo', e.target.value)}>${METODOS.map(u => html`<option key=${u}>${u}</option>`)}</select></label>
      </div>
      <label className="campo"><span>Responsable</span><input className="inp" value=${a.responsable} onChange=${e => set('responsable', e.target.value)} /></label>
      <label className="campo"><span>Observaciones</span><textarea className="inp" value=${a.observaciones} onChange=${e => set('observaciones', e.target.value)}></textarea></label>
      <div className="fila-btn"><button className="btn" onClick=${onCerrar}>Cancelar</button><button className="btn btn-p" disabled=${!valido} onClick=${guardar}>${inicial ? 'Guardar cambios' : 'Registrar aplicación'}</button></div>
    </div>
  </div>`;
}

function Aplicaciones({ usuario }) {
  const st = useStore();
  const [form, setForm] = useState(null);
  const esAdmin = usuario.rol === 'administrador';
  const apps = vivos(st.datos.aplicaciones).sort((a, b) => b.fecha.localeCompare(a.fecha));

/* ---------- Gráficas ---------- */
function escalaNice(min, max, n = 5) {
  if (min == null || max == null) return { min: 0, max: 1, ticks: [0, 1] };
  if (min === max) { min = min - 1; max = max + 1; }
  const paso0 = (max - min) / n; const mag = Math.pow(10, Math.floor(Math.log10(paso0))); const r = paso0 / mag;
  const paso = (r > 5 ? 10 : r > 2 ? 5 : r > 1 ? 2 : 1) * mag;
  const lo = Math.floor(min / paso) * paso, hi = Math.ceil(max / paso) * paso;
  const ticks = []; for (let v = lo; v <= hi + paso / 2; v += paso) ticks.push(+v.toFixed(6));
  return { min: lo, max: hi, ticks };
}
function GraficaLineas({ semanas, series, marcadores = [], alto = 260, sel, onSel, ceroBase = true, refs = [] }) {
  const [ref, ancho] = useAncho();
  const W = Math.max(ancho, 280), H = alto, pad = { l: 46, r: 14, t: 16, b: 30 };
  const n = semanas.length;
  const x = i => pad.l + (n <= 1 ? (W - pad.l - pad.r) / 2 : i * (W - pad.l - pad.r) / (n - 1));
  const vals = series.flatMap(s => s.valores).filter(v => v != null);
  const esc = escalaNice(vals.length ? (ceroBase ? Math.min(0, ...vals) : Math.min(...vals)) : 0, vals.length ? Math.max(...vals, ...refs.map(r => r.v)) : 1);
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - esc.min) / (esc.max - esc.min || 1));
  const paso = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W - pad.l) / 46))));
  const colW = n > 1 ? (W - pad.l - pad.r) / (n - 1) : W;
  return html`<div ref=${ref} style=${{ width: '100%' }}>
    <svg width=${W} height=${H} role="img" aria-label="Serie semanal" style=${{ display: 'block', overflow: 'visible' }}>
      ${esc.ticks.map(t => html`<g key=${t}><line x1=${pad.l} x2=${W - pad.r} y1=${y(t)} y2=${y(t)} stroke="var(--line)" stroke-width="1" />
        <text x=${pad.l - 6} y=${y(t) + 4} text-anchor="end" font-size="12" fill="var(--ink-2)">${fmt(t, t % 1 ? 1 : 0)}</text></g>`)}
      ${refs.map((r, i) => html`<g key=${'r' + i}><line x1=${pad.l} x2=${W - pad.r} y1=${y(r.v)} y2=${y(r.v)} stroke=${r.color} stroke-width="2" stroke-dasharray="2 4" />
        <text x=${W - pad.r} y=${y(r.v) - 4} text-anchor="end" font-size="11" fill=${r.color} font-weight="700">${r.etq}</text></g>`)}
      ${semanas.map((s, i) => i % paso === 0 ? html`<text key=${s} x=${x(i)} y=${H - 8} text-anchor="middle" font-size="12" fill="var(--ink-2)">${etqSem(s)}</text>` : null)}
      ${marcadores.map((m, k) => html`<g key=${'m' + k}><line x1=${x(m.i)} x2=${x(m.i)} y1=${pad.t} y2=${H - pad.b} stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 4" />
        <path d=${`M${x(m.i) - 7},${pad.t - 12} h14 l-7,10 z`} fill="var(--ink)"><title>${m.titulo}</title></path></g>`)}
      ${sel != null && sel < n && html`<line x1=${x(sel)} x2=${x(sel)} y1=${pad.t} y2=${H - pad.b} stroke="var(--banana)" stroke-width="3" />`}
      ${series.map((s, si) => {
        const pts = s.valores.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
        if (!pts.length) return null;
        return html`<g key=${s.id}>
          <path d=${'M' + pts.map(p => p.join(',')).join(' L')} fill="none" stroke=${s.color} stroke-width=${s.grueso ? 4 : 2.5} stroke-linejoin="round" stroke-linecap="round" />
          ${pts.map((p, j) => html`<circle key=${j} cx=${p[0]} cy=${p[1]} r=${s.grueso ? 4.5 : 3.2} fill=${s.color} />`)}</g>`;
      })}
      ${semanas.map((s, i) => html`<rect key=${'h' + s} x=${x(i) - colW / 2} y=${pad.t} width=${colW} height=${H - pad.t - pad.b} fill="transparent"
        onClick=${() => onSel && onSel(i)} onMouseEnter=${() => onSel && onSel(i)} style=${{ cursor: 'pointer' }} />`)}
    </svg></div>`;
}
function GraficaClima({ semanas, barras, linea, alto = 150, sel, onSel, etqBarras, etqLinea }) {
  const [ref, ancho] = useAncho();
  const W = Math.max(ancho, 280), H = alto, pad = { l: 46, r: 46, t: 12, b: 26 };
  const n = semanas.length;
  const x = i => pad.l + (n <= 1 ? (W - pad.l - pad.r) / 2 : i * (W - pad.l - pad.r) / (n - 1));
  const colW = n > 1 ? (W - pad.l - pad.r) / (n - 1) : 40;
  const vb = barras.filter(v => v != null), vl = linea.filter(v => v != null);
  const eb = escalaNice(0, vb.length ? Math.max(...vb, 1) : 1, 3), el = escalaNice(vl.length ? Math.min(...vl) : 0, vl.length ? Math.max(...vl) : 1, 3);
  const yb = v => pad.t + (H - pad.t - pad.b) * (1 - v / (eb.max || 1));
  const yl = v => pad.t + (H - pad.t - pad.b) * (1 - (v - el.min) / ((el.max - el.min) || 1));
  const pts = linea.map((v, i) => v == null ? null : [x(i), yl(v)]).filter(Boolean);
  const paso = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W - pad.l) / 46))));
  return html`<div ref=${ref}><svg width=${W} height=${H} role="img" aria-label="Clima semanal" style=${{ display: 'block' }}>
    ${eb.ticks.map(t => html`<g key=${'b' + t}><line x1=${pad.l} x2=${W - pad.r} y1=${yb(t)} y2=${yb(t)} stroke="var(--line)" />
      <text x=${pad.l - 6} y=${yb(t) + 4} text-anchor="end" font-size="11" fill="var(--info)">${fmt(t, 0)}</text></g>`)}
    ${el.ticks.map(t => html`<text key=${'l' + t} x=${W - pad.r + 6} y=${yl(t) + 4} font-size="11" fill="var(--s3)">${fmt(t, 0)}</text>`)}
    ${barras.map((v, i) => v == null ? null : html`<rect key=${i} x=${x(i) - Math.min(colW * 0.32, 14)} width=${Math.min(colW * 0.64, 28)} y=${yb(v)} height=${H - pad.b - yb(v)} fill="var(--info)" opacity="0.55" rx="2" />`)}
    ${pts.length > 0 && html`<path d=${'M' + pts.map(p => p.join(',')).join(' L')} fill="none" stroke="var(--s3)" stroke-width="2.5" />`}
    ${pts.map((p, j) => html`<circle key=${'c' + j} cx=${p[0]} cy=${p[1]} r="3" fill="var(--s3)" />`)}
    ${sel != null && sel < n && html`<line x1=${x(sel)} x2=${x(sel)} y1=${pad.t} y2=${H - pad.b} stroke="var(--banana)" stroke-width="3" />`}
    ${semanas.map((s, i) => i % paso === 0 ? html`<text key=${s} x=${x(i)} y=${H - 6} text-anchor="middle" font-size="12" fill="var(--ink-2)">${etqSem(s)}</text>` : null)}
    ${semanas.map((s, i) => html`<rect key=${'h' + s} x=${x(i) - colW / 2} y=${pad.t} width=${colW} height=${H - pad.t - pad.b} fill="transparent" onClick=${() => onSel && onSel(i)} onMouseEnter=${() => onSel && onSel(i)} />`)}
  </svg>
  <div className="leyenda"><span><i className="sem" style=${{ background: 'var(--info)', opacity: .55, borderRadius: 3 }}></i>${etqBarras} (eje izq.)</span><span><i className="sem" style=${{ background: 'var(--s3)' }}></i>${etqLinea} (eje der.)</span></div>
  </div>`;
}

function MapaTablas({ tablas, valores, umbrales, sel, onSel }) {
  const conGeo = tablas.filter(t => t.geometria && t.geometria.coordinates && t.geometria.coordinates[0] && t.geometria.coordinates[0].length > 2);
  if (!conGeo.length) return html`<div className="vacio-panel">Las tablas no tienen polígonos. Importa el KMZ en Administración.</div>`;
  const all = conGeo.flatMap(t => t.geometria.coordinates[0]);
  const lat0 = all.reduce((s, p) => s + p[1], 0) / all.length, k = Math.cos(lat0 * Math.PI / 180);
  const xs = all.map(p => p[0] * k), ys = all.map(p => -p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const Wv = 1000, esc = Wv / ((maxX - minX) || 1e-6), Hv = Math.max(200, (maxY - minY) * esc), m = 20;
  const pr = p => [m + (p[0] * k - minX) * esc * (Wv - 2 * m) / Wv, m + (-p[1] - minY) * esc * (Wv - 2 * m) / Wv];
  const fs = Math.max(14, Math.min(34, Wv / Math.sqrt(conGeo.length) / 6));
  return html`<div className="mapa"><svg viewBox=${`0 0 ${Wv} ${Hv + 2 * m}`} role="img" aria-label="Mapa de tablas por índice de infección">
    ${conGeo.map(t => {
      const ring = t.geometria.coordinates[0].map(pr);
      const c = ring.reduce((a, p) => [a[0] + p[0] / ring.length, a[1] + p[1] / ring.length], [0, 0]);
      const v = valores[t.id]; const s = Calc.semaforo(v, umbrales);
      return html`<g key=${t.id}><polygon points=${ring.map(p => p.join(',')).join(' ')} fill=${COLOR_SEM[s]} fill-opacity=${s === 'sin' ? 0.5 : 0.85}
          className=${sel === t.id ? 'sel' : ''} onClick=${() => onSel(t.id)}><title>${t.codigo}: II ${fmt(v)}</title></polygon>
        <text x=${c[0]} y=${c[1]} text-anchor="middle" font-size=${fs} fill="var(--ink)">${t.codigo}</text>
        <text x=${c[0]} y=${c[1] + fs * 1.05} text-anchor="middle" font-size=${fs * 0.8} fill="var(--ink)">${v == null ? '' : fmt(v)}</text></g>`;
    })}
  </svg></div>`;
}

function Tablero() {
  const st = useStore();
  const d = st.datos;
  const cfg = d.config.umbrales || Modelo.configInicial();
  const hoy = Modelo.hoy();
  const [desde, setDesde] = usePref('f.desde', Modelo.sumarDias(hoy, -16 * 7));
  const [hasta, setHasta] = usePref('f.hasta', hoy);
  const [operador, setOperador] = useState('');
  const [selTablas, setSelTablas] = useState([]);
  const [ind, setInd] = useState('ii');
  const [lag, setLag] = useState(4);
  const [varClima, setVarClima] = useState('horas_hr_alta');
  const [semSel, setSemSel] = useState(null);
  const [hover, setHover] = useState(null);
  const [tablaDet, setTablaDet] = useState(null);
  const [mostrarFiltroTablas, setMostrarFiltroTablas] = useState(false);
  const todasTablas = ordenarTablas(vivos(d.tablas).filter(t => t.activa));
  const tablasF = selTablas.length ? todasTablas.filter(t => selTablas.includes(t.id)) : todasTablas;
  const operadores = vivos(d.usuarios);
  const indic = Analisis.INDICADORES.find(i => i.k === ind);
  const iiInd = Analisis.INDICADORES[0];

  const fs = useMemo(() => Analisis.filas(d, { desde, hasta, operador: operador || null, tablas: selTablas }), [d.evaluaciones, d.recorridos, desde, hasta, operador, selTablas]);
  const serie = useMemo(() => Analisis.serie(fs), [fs]);
  const serieTotal = useMemo(() => Analisis.serie(Analisis.filas(d, {})), [d.evaluaciones, d.recorridos]);
  const semanas = useMemo(() => desde && hasta && desde <= hasta ? Modelo.rangoSemanas(Modelo.semanaISO(desde), Modelo.semanaISO(hasta)) : [], [desde, hasta]);
  const semanasConDatos = semanas.filter(s => [...serie.values()].some(m => m.has(s)));
  const cobertura = s => [...serie.values()].filter(m => m.has(s)).length;
  const maxCob = Math.max(0, ...semanasConDatos.map(cobertura));
  const semDefecto = semanasConDatos.filter(s => cobertura(s) >= maxCob / 2).pop() || semanasConDatos[semanasConDatos.length - 1] || null;
  const semActiva = semSel && semanasConDatos.includes(semSel) ? semSel : semDefecto;
  const climaSem = useMemo(() => Clima.porSemana(Clima.todosLosDias(d)), [d.clima]);
  const climaVars = { horas_hr_alta: 'Horas con HR alta', hr_media: 'HR media (%)', temp_media: 'Temp. media (°C)', temp_min: 'Temp. mínima (°C)' };

  // Estado por tabla en la semana activa
  const estado = tablasF.map(t => {
    const st_ = serie.get(t.id);
    let semT = semActiva && st_ && st_.has(semActiva) ? semActiva : null;
    if (!semT && semActiva) { const p = Analisis.previa(st_, semActiva); if (p && p >= Modelo.sumarSemanas(semActiva, -2)) semT = p; }
    const v = semT ? Analisis.valorEn(st_, semT, iiInd) : null;
    const prevS = semT ? Analisis.previa(st_, semT) : null;
    const vp = prevS ? Analisis.valorEn(st_, prevS, iiInd) : null;
    const x = st_ && semT ? st_.get(semT) : null;
    const ua = Analisis.ultimaAplicacion(d, t.id);
    return { t, ii: v, delta: v != null && vp != null ? v - vp : null, r: x ? x.r : null, dias: ua ? Modelo.diasEntre(ua.fecha, hoy) : null, ua, sem: Calc.semaforo(v, cfg), semT };
  });
  const valoresMapa = Object.fromEntries(estado.map(e => [e.t.id, e.ii]));
  const empeoran = estado.filter(e => e.delta != null && e.delta >= 2).sort((a, b) => b.delta - a.delta);
  const revisar = estado.filter(e => (e.sem === 'rojo' || e.sem === 'amarillo') && (e.dias == null || e.dias >= cfg.dias_alerta_aplicacion)).sort((a, b) => (b.ii || 0) - (a.ii || 0));
  const apps = vivos(d.aplicaciones).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const appsVisibles = apps.filter(a => a.tabla_ids.some(id => tablasF.some(t => t.id === id)));
  const conSeguimiento = a => a.tabla_ids.some(id => { const e = Analisis.efectoAplicacion(serieTotal, a, id); return e && e.antes != null && e.d2; });
  const ultimaApp = appsVisibles.find(conSeguimiento) || appsVisibles[0];
  const masReciente = appsVisibles[0] && appsVisibles[0] !== ultimaApp ? appsVisibles[0] : null;
  const efectoUltima = ultimaApp ? ultimaApp.tabla_ids.filter(id => tablasF.some(t => t.id === id)).map(id => ({ id, e: Analisis.efectoAplicacion(serieTotal, ultimaApp, id) })).filter(x => x.e && x.e.antes != null) : [];
  const efProm = (k) => { const v = efectoUltima.map(x => x.e[k] && x.e[k].v).filter(v => v != null); return v.length ? Calc.prom(v) : null; };
  const antesProm = Calc.prom(efectoUltima.map(x => x.e.antes));

  // Repuntes y clima previo (con desfase)
  const repuntes = [];
  tablasF.forEach(t => { const m = serie.get(t.id); if (!m) return; [...m.keys()].sort().forEach(k => { const p = Analisis.previa(m, k); if (p) { const dv = Analisis.valorEn(m, k, iiInd) - Analisis.valorEn(m, p, iiInd); if (dv >= 3) repuntes.push(k); } }); });
  const semRep = [...new Set(repuntes)];
  const climaAntes = c => Calc.prom(semRep.map(k => { const x = climaSem.get(Modelo.sumarSemanas(k, -lag)); return x ? x[c] : null; }));
  const climaGeneral = c => Calc.prom(semanas.map(k => { const x = climaSem.get(Modelo.sumarSemanas(k, -lag)); return x ? x[c] : null; }));

  // Series
  const seriesG = tablasF.map((t, i) => ({ id: t.id, nombre: t.codigo, color: COLOR_SERIE(i), valores: semanas.map(s => Analisis.valorEn(serie.get(t.id), s, indic)) }));
  const promRancho = semanas.map(s => { const sub = fs.filter(x => x.semana === s).flatMap(x => x.ev.plantas); return sub.length ? indic.get(Calc.resumen(sub)) : null; });
  if (seriesG.length > 1) seriesG.push({ id: 'rancho', nombre: 'Rancho', color: 'var(--ink)', valores: promRancho, grueso: true });
  const marcadores = [];
  appsVisibles.forEach(a => { const i = semanas.indexOf(Modelo.semanaISO(a.fecha)); if (i >= 0) marcadores.push({ i, titulo: `${fechaSinAnio(a.fecha)}: ${a.producto} (FRAC ${a.grupo_frac})`, a }); });
  const climaDesf = semanas.map(s => climaSem.get(Modelo.sumarSemanas(s, -lag)) || null);
  const hv = hover != null ? hover : null;

  const detT = tablaDet && tablasF.some(t => t.id === tablaDet) ? tablaDet : (estado.slice().sort((a, b) => (b.ii || -1) - (a.ii || -1))[0] || {}).t?.id;
  const det = detT && semActiva && serie.get(detT) ? serie.get(detT).get(semActiva) : null;
  const dist = det ? Calc.distribucion(det.plantas) : [];
  const nombreT = id => (d.tablas[id] || {}).codigo || '?';

  async function exportar(tipo) {
    const t = Exportar.tablasPlano(d, { desde, hasta, operador: operador || null, tablas: selTablas });
    const sufijo = `${desde}_${hasta}`;
    try {
      let r;
      if (tipo === 'xlsx') r = await Exportar.descargar(`sigatoka_${sufijo}.xlsx`, Exportar.excel(t));
      else r = await Exportar.descargar(`sigatoka_${tipo}_${sufijo}.csv`, Exportar.csv(t[tipo]));
      if (r === 'ok') avisar('Archivo listo');
    } catch (e) { avisar(e.message || 'No se pudo exportar'); }
  }
  const valorSemana = (arr, i) => arr[i] == null ? '—' : fmt(arr[i], indic.dec);

  return html`<div>
    <div style=${{ display: 'flex', alignItems: 'baseline', gap: 12, flexWrap: 'wrap' }}><h1 style=${{ marginRight: 'auto' }}>Tablero</h1>
      <span className="muted peq">${fs.length} evaluaciones de tabla, ${fs.reduce((s, x) => s + x.ev.plantas.length, 0)} plantas en el periodo</span></div>
    <div className="caja" style=${{ margin: '12px 0 16px' }}>
      <div className="filtros">
        <label>Desde<input className="inp" type="date" value=${desde} onChange=${e => setDesde(e.target.value)} /></label>
        <label>Hasta<input className="inp" type="date" value=${hasta} onChange=${e => setHasta(e.target.value)} /></label>
        <label>Semana de corte<select className="inp" value=${semActiva || ''} onChange=${e => setSemSel(e.target.value)}>${semanasConDatos.slice().reverse().map(s => html`<option key=${s} value=${s}>${etqSem(s)} (${fechaSinAnio(Modelo.lunesDeSemana(s))})</option>`)}</select></label>
        <label>Operador<select className="inp" value=${operador} onChange=${e => setOperador(e.target.value)}><option value="">Todos</option>${operadores.map(u => html`<option key=${u.id} value=${u.id}>${u.nombre}</option>`)}</select></label>
        <button className="btn btn-s btn-q" onClick=${() => setMostrarFiltroTablas(!mostrarFiltroTablas)}>Tablas: ${selTablas.length ? selTablas.length + ' de ' + todasTablas.length : 'todas'}</button>
      </div>

        <div className="panel-cab"><h2>Mapa de riesgo</h2><span className="muted peq">II, semana ${etqSem(semActiva)}</span></div>

          ${marcadores.filter(m => m.i === hv).map(m => html`<div key=${m.a.id}>Aplicación: ${m.titulo}</div>`)}
          ${climaDesf[hv] && html`<div>Clima ${lag ? `de ${etqSem(Modelo.sumarSemanas(semanas[hv], -lag))}` : ''}: lluvia ${fmt(climaDesf[hv].precipitacion, 0)} mm, HR media ${fmt(climaDesf[hv].hr_media, 0)} %, ${fmt(climaDesf[hv].horas_hr_alta, 0)} h de HR alta, temp. media ${fmt(climaDesf[hv].temp_media)} °C.</div>`}
        </div>`}
      </section>

      <section className="panel c6">
        <div className="panel-cab"><h2>Comparativo de la semana</h2><span className="muted peq">${indic.corto}, ${etqSem(semActiva)}</span></div>
        ${(() => {
          const filas = tablasF.map(t => ({ t, v: Analisis.valorEn(serie.get(t.id), semActiva, indic) })).filter(x => x.v != null).sort((a, b) => indic.peorSi === 'sube' ? b.v - a.v : a.v - b.v);
          const mx = Math.max(...filas.map(f => f.v), 1);
          return filas.length ? filas.map(f => html`<div key=${f.t.id} className="barra-h"><b>${f.t.codigo}</b>
            <div className="fondo"><div className="val" style=${{ width: (f.v / mx * 100) + '%', background: ind === 'ii' ? COLOR_SEM[Calc.semaforo(f.v, cfg)] : 'var(--leaf)' }}></div></div>
            <span className="num" style=${{ textAlign: 'right' }}>${fmt(f.v, indic.dec)}</span></div>`) : html`<div className="vacio-panel">Sin datos en esta semana.</div>`;
        })()}
      </section>

      <section className="panel c6">
        <div className="panel-cab"><h2>Efecto de las aplicaciones</h2><span className="muted peq">II antes y después, últimas 4 aplicaciones</span></div>
        <div className="desliza"><table className="datos"><thead><tr><th>Fecha</th><th>Producto</th><th>FRAC</th><th>Tabla</th><th className="n">Antes</th><th className="n">+2 sem</th><th className="n">+4 sem</th><th className="n">Cambio</th></tr></thead>
          <tbody>${appsVisibles.slice(0, 4).flatMap(a => a.tabla_ids.filter(id => tablasF.some(t => t.id === id)).map((id, j) => {
            const e = Analisis.efectoAplicacion(serieTotal, a, id) || {};
            const dd = e.d4 && e.antes != null ? e.d4.v - e.antes : e.d2 && e.antes != null ? e.d2.v - e.antes : null;
            return html`<tr key=${a.id + id}><td>${j === 0 ? fechaSinAnio(a.fecha) : ''}</td><td>${j === 0 ? a.producto : ''}</td><td>${j === 0 ? a.grupo_frac : ''}</td><td><b>${nombreT(id)}</b></td>
              <td className="n">${fmt(e.antes)}</td><td className="n">${fmt(e.d2 && e.d2.v)}</td>
              <td className="n">${fmt(e.d4 && e.d4.v)}</td>
              <td className="n" style=${{ color: dd == null ? '' : dd < 0 ? 'var(--verde)' : 'var(--error)', fontWeight: 700 }}>${dd == null ? '—' : (dd > 0 ? '+' : '') + fmt(dd)}</td></tr>`;
          }))}</tbody></table></div>
        ${!appsVisibles.length && html`<div className="vacio-panel">Sin aplicaciones registradas.</div>`}
      </section>

      <section className="panel c12">
        <div className="panel-cab"><h2>Detalle por planta y hoja</h2>
          <select className="inp" style=${{ width: 'auto', minHeight: 44 }} value=${detT || ''} onChange=${e => setTablaDet(e.target.value)}>${tablasF.map(t => html`<option key=${t.id} value=${t.id}>${t.codigo}</option>`)}</select>
          <span className="muted peq">semana ${etqSem(semActiva)}</span></div>
        ${det ? html`<div>
          <div className="kpis" style=${{ marginBottom: 12 }}>
            <div className="kpi"><b className="num">${fmt(det.r.ii)}</b><span>II (%)</span></div><div className="kpi"><b className="num">${fmt(det.r.th)}</b><span>TH prom.</span></div>
            <div className="kpi"><b className="num">${fmt(det.r.hf)}</b><span>HF prom.</span></div><div className="kpi"><b className="num">${fmt(det.r.pizca.prom)}</b><span>Pizca prom.</span></div>
            <div className="kpi"><b className="num">${fmt(det.r.estria.prom)}</b><span>HMJE prom.${det.r.estria.no_presenta ? ` (${det.r.estria.no_presenta} sin estría)` : ''}</span></div>
            <div className="kpi"><b className="num">${fmt(det.r.mancha.prom)}</b><span>HMJM prom.${det.r.mancha.no_presenta ? ` (${det.r.mancha.no_presenta} sin mancha)` : ''}</span></div></div>
          <h3 style=${{ margin: '8px 0' }}>Distribución de grados por posición de hoja</h3>
          ${dist.map((fila, i) => { const tot = fila.reduce((a, b) => a + b, 0); return tot ? html`<div key=${i} className="barra-h" style=${{ gridTemplateColumns: '64px 1fr 44px' }}>
            <span className="peq">Hoja ${i + 1}</span><div className="apilada">${fila.map((c, g) => c ? html`<div key=${g} className=${'gc' + g} style=${{ width: (c / tot * 100) + '%' }} title=${`Grado ${g}: ${c} planta(s)`}></div>` : null)}</div>
            <span className="peq muted num" style=${{ textAlign: 'right' }}>${tot}</span></div>` : null; })}
          <div className="leyenda">${Calc.GRADOS.map(g => html`<span key=${g.g}><i className=${'cuad gc' + g.g} style=${{ width: 18, height: 18 }}></i>${g.g}</span>`)}</div>
          <h3 style=${{ margin: '14px 0 8px' }}>Plantas</h3>
          <div className="desliza"><table className="datos"><thead><tr><th className="n">Nº</th><th className="n">TH</th><th className="n">HF</th><th className="n">II</th><th className="n">Pizca</th><th className="n">Estría</th><th className="n">Mancha</th><th>Hojas (grado Gauhl)</th><th>Observaciones</th></tr></thead>
            <tbody>${det.plantas.slice().sort((a, b) => a.numero_planta - b.numero_planta).map(p => html`<tr key=${p.id}>
              <td className="n">${p.numero_planta}</td><td className="n">${p.total_hojas}</td><td className="n">${Calc.hf(p)}</td><td className="n">${fmt(Calc.iiPlanta(p))}</td>
              ${['hmj_pizca', 'hmj_estria', 'hmj_mancha'].map(k => html`<td key=${k} className="n">${p[k] == null ? '—' : p[k] === 0 ? 'NP' : p[k]}</td>`)}
              <td><${TiraHojas} planta=${p} /></td><td style=${{ whiteSpace: 'normal', minWidth: 140 }}>${p.observaciones}</td></tr>`)}</tbody></table></div>
          <p className="peq muted">NP = no presenta.</p>
        </div>` : html`<div className="vacio-panel">Sin evaluación de esta tabla en la semana seleccionada.</div>`}
      </section>

      <section className="panel c12">
        <div className="panel-cab"><h2>Exportar</h2><span className="muted peq">Con los filtros de fechas, operador y tablas</span></div>
        <div className="fila-btn">
          <button className="btn btn-p" onClick=${() => exportar('xlsx')}>Excel (todas las hojas)</button>
          <button className="btn" onClick=${() => exportar('resumen')}>CSV resumen semanal</button>
          <button className="btn" onClick=${() => exportar('plantas')}>CSV plantas</button>

/* ---------- Administración ---------- */
function Admin({ usuario }) {
  const st = useStore();
  const d = st.datos;
  const cfg = d.config.umbrales || Modelo.configInicial();
  const [msg, setMsg] = useState(null);
  const kmz = useRef(null), csvRef = useRef(null);
  const hoy = Modelo.hoy();
  const [reemplazar, setReemplazar] = useState(true);
  const [cDesde, setCDesde] = useState(Modelo.sumarDias(hoy, -24 * 7));
  const [cHasta, setCHasta] = useState(hoy);
  const tablas = ordenarTablas(vivos(d.tablas));
  const usuarios = vivos(d.usuarios);
  const dias = Clima.todosLosDias(d);
  const setCfg = (k, v) => Store.put('config', { ...cfg, [k]: v });
  const editarTabla = (t, k, v) => { if (t[k] !== v) Store.put('tablas', { ...t, [k]: v }); };
  async function importarKmz(e) {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const pol = await Geo.leer(f);
      const existentes = vivos(d.tablas);
      const nuevas = [], act = [];
      pol.forEach(p => {
        const geom = { type: 'Polygon', coordinates: [p.anillo] }, sup = Math.round(Geo.areaHa(p.anillo) * 100) / 100;
        const ex = existentes.find(t => t.codigo === p.nombre && t.origen !== 'ejemplo');
        if (ex) act.push({ ...ex, geometria: geom, superficie_ha: sup, activa: true });
        else nuevas.push(Modelo.nuevaTabla({ codigo: p.nombre.slice(0, 40), nombre: p.nombre, superficie_ha: sup, geometria: geom, origen: 'kmz' }));
      });
      const tocadas = new Set(act.map(t => t.id));
      const ejemplos = existentes.filter(t => t.activa && !tocadas.has(t.id) && (reemplazar || t.origen === 'ejemplo')).map(t => ({ ...t, activa: false }));
      Store.putMuchos('tablas', [...act, ...nuevas, ...ejemplos]);
      const c = Geo.centroide(pol.flatMap(p => p.anillo));
      Store.put('config', { ...cfg, rancho_lon: +c[0].toFixed(5), rancho_lat: +c[1].toFixed(5) });
      setMsg({ t: 'info', m: `Importadas ${nuevas.length} tablas nuevas y ${act.length} actualizadas.${ejemplos.length ? ` Se desactivaron ${ejemplos.length} tablas que no venían en el archivo (sus datos históricos se conservan).` : ''}` });
    } catch (err) { setMsg({ t: 'error', m: err.message }); }
  }
  async function importarCsv(e) {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try { const ds = Clima.parseCSV(await f.text()); Store.putMuchos('clima', Clima.aDocumentosMes(ds, d.clima)); setMsg({ t: 'info', m: `Importados ${ds.length} días de clima.` }); }
    catch (err) { setMsg({ t: 'error', m: err.message }); }
  }
  function simularClima() {
    if (cDesde > cHasta) { setMsg({ t: 'error', m: 'La fecha inicial debe ser anterior a la final.' }); return; }
    const ds = Clima.simular(cDesde, cHasta, Math.floor(Math.random() * 1e6));
    Store.putMuchos('clima', Clima.aDocumentosMes(ds, d.clima)); setMsg({ t: 'info', m: `Generados ${ds.length} días de clima simulado.` });
  }
  async function cargarDemo() {
    if (!tablas.some(t => t.activa)) { setMsg({ t: 'error', m: 'Primero activa o importa tablas.' }); return; }
    if (vivos(d.recorridos).some(r => r.origen === 'demo') && !(await confirmar('Se agregará otro juego de 16 semanas.', { titulo: 'Ya hay datos de demostración', aceptar: 'Agregar' }))) return;
    const g = Demo.generar(d, cfg);
    Store.putMuchos('clima', g.clima); Store.putMuchos('recorridos', g.recorridos); Store.putMuchos('evaluaciones', g.evaluaciones); Store.putMuchos('aplicaciones', g.aplicaciones);
    setMsg({ t: 'info', m: `Se agregaron ${g.recorridos.length} recorridos y ${g.aplicaciones.length} aplicaciones de demostración.` });
  }
  async function quitarDemo() {
    if (!(await confirmar('Se quitan los recorridos, evaluaciones y aplicaciones marcados como demostración. Tus capturas reales no se tocan.', { titulo: '¿Quitar datos de demostración?', aceptar: 'Quitar', peligro: true }))) return;
    ['recorridos', 'evaluaciones', 'aplicaciones'].forEach(c => Store.putMuchos(c, vivos(d[c]).filter(r => r.origen === 'demo').map(r => ({ ...r, eliminado: true }))));
    setMsg({ t: 'info', m: 'Datos de demostración eliminados.' });
  }
  const [progreso, setProgreso] = useState(null);
  async function reiniciar() {
    const srv = st.sync.modo === 'servidor';
    const ok = await confirmar(srv
      ? 'Se borra todo en este dispositivo y en el almacén compartido. Los demás dispositivos también quedarán vacíos. No se puede deshacer.'
      : 'Se borran todos los datos de este dispositivo. No se puede deshacer.', { titulo: '¿Reiniciar la app?', aceptar: 'Borrar todo', peligro: true });
    if (!ok) return;
    setProgreso('Borrando…');
    try { await Reinicio.todo(n => setProgreso(`Borrando… ${n} registros del almacén compartido`)); }
    catch (e) { setProgreso(null); setMsg({ t: 'error', m: 'No se pudo completar el reinicio: ' + ((e && (e.code || e.message)) || 'error') + '. Intenta de nuevo.' }); }
  }
  async function respaldo() {
    const out = { exportado: Modelo.ahora(), version_modelo: 1 };
    COLECCIONES.forEach(c => { out[c] = Object.values(d[c]); });
    const r = await Exportar.descargar(`sigatoka_respaldo_${hoy}.json`, JSON.stringify(out, null, 1));
    if (r === 'ok') avisar('Respaldo listo');
  }
  return html`<div>
    <h1>Administración</h1>
    ${msg && html`<div className=${msg.t}>${msg.m}</div>`}

    <section className="seccion"><h2>Tablas</h2>
      <p className="peq muted">${tablas.filter(t => t.activa).length} activas de ${tablas.length}. Importa el KMZ o KML del rancho; si una tabla ya existe con el mismo nombre, se actualiza su polígono.</p>
      <input ref=${kmz} type="file" accept=".kmz,.kml" hidden onChange=${importarKmz} />
      <label className="interruptor" style=${{ display: 'flex' }}><input type="checkbox" checked=${reemplazar} onChange=${e => setReemplazar(e.target.checked)} />Desactivar las tablas que no vengan en el archivo</label>
      <button className="btn btn-p" onClick=${() => kmz.current.click()}>Importar KMZ o KML</button>
      <div className="desliza" style=${{ marginTop: 12 }}><table className="datos tabla-admin"><thead><tr><th>Código</th><th>Variedad</th><th className="n">Superficie (ha)</th><th>Origen</th><th>Activa</th></tr></thead>
        <tbody>${tablas.map(t => html`<tr key=${t.id}>
          <td><input defaultValue=${t.codigo} style=${{ minWidth: 90 }} onBlur=${e => editarTabla(t, 'codigo', e.target.value.trim() || t.codigo)} /></td>
          <td><input defaultValue=${t.variedad} style=${{ minWidth: 120 }} onBlur=${e => editarTabla(t, 'variedad', e.target.value.trim())} /></td>
          <td><input type="number" step="0.01" defaultValue=${t.superficie_ha ?? ''} style=${{ width: 100 }} onBlur=${e => editarTabla(t, 'superficie_ha', e.target.value === '' ? null : Number(e.target.value))} /></td>
          <td className="peq muted">${{ kmz: 'KMZ', ejemplo: 'Ejemplo', manual: 'Manual' }[t.origen] || t.origen}</td>
          <td><input type="checkbox" checked=${t.activa} style=${{ width: 24, height: 24, minHeight: 0 }} onChange=${e => editarTabla(t, 'activa', e.target.checked)} aria-label=${'Activa ' + t.codigo} /></td></tr>`)}</tbody></table></div>
    </section>

    <section className="seccion"><h2>Usuarios</h2>
      <p className="peq muted">En el prototipo el usuario se elige arriba. En producción cada persona iniciará sesión con su cuenta.</p>
      <div className="desliza"><table className="datos tabla-admin"><thead><tr><th>Nombre</th><th>Rol</th><th>Activo</th></tr></thead>
        <tbody>${usuarios.map(u => html`<tr key=${u.id}>
          <td><input defaultValue=${u.nombre} onBlur=${e => { const v = e.target.value.trim(); if (v && v !== u.nombre) Store.put('usuarios', { ...u, nombre: v }); }} /></td>
          <td><select value=${u.rol} onChange=${e => Store.put('usuarios', { ...u, rol: e.target.value })}><option value="operador">Operador</option><option value="administrador">Administrador</option></select></td>
          <td><input type="checkbox" checked=${u.activo !== false} disabled=${u.id === usuario.id} style=${{ width: 24, height: 24, minHeight: 0 }} onChange=${e => Store.put('usuarios', { ...u, activo: e.target.checked })} /></td></tr>`)}</tbody></table></div>
      <button className="btn" style=${{ marginTop: 10 }} onClick=${() => Store.put('usuarios', Modelo.nuevoUsuario({ nombre: `Operador ${usuarios.filter(u => u.rol === 'operador').length + 1}` }))}>Agregar operador</button>
    </section>

    <section className="seccion"><h2>Umbrales del semáforo</h2>
      <div className="aviso peq">Valores provisionales. Defínelos con tu agrónomo antes de usarlos para decidir aplicaciones.</div>
      <div className="rejilla2">
        <label className="campo"><span>Riesgo bajo si II es menor que</span><input className="inp" type="number" step="0.5" defaultValue=${cfg.ii_verde} onBlur=${e => setCfg('ii_verde', Number(e.target.value))} /></label>
        <label className="campo"><span>Riesgo alto si II es mayor o igual a</span><input className="inp" type="number" step="0.5" defaultValue=${cfg.ii_amarillo} onBlur=${e => setCfg('ii_amarillo', Number(e.target.value))} /></label>
        <label className="campo"><span>Alertar después de (días sin aplicación)</span><input className="inp" type="number" step="1" defaultValue=${cfg.dias_alerta_aplicacion} onBlur=${e => setCfg('dias_alerta_aplicacion', Number(e.target.value))} /></label>
      </div>
    </section>

    <section className="seccion"><h2>Clima</h2>
      <p className="peq muted">${dias.length ? `${dias.length} días cargados, del ${fechaCorta(dias[0].fecha)} al ${fechaCorta(dias[dias.length - 1].fecha)}. Fuente: ${[...new Set(dias.map(x => x.fuente))].join(', ')}.` : 'Sin datos de clima.'}
        Coordenadas del rancho: ${cfg.rancho_lat}, ${cfg.rancho_lon}. En producción el servidor consultará Open-Meteo una vez al día.</p>
      <input ref=${csvRef} type="file" accept=".csv,text/csv" hidden onChange=${importarCsv} />
      <div className="caja">
        <h3>Importar CSV</h3>
        <p className="peq">Columnas: <code>fecha, temp_max, temp_min, temp_media, hr_media, precipitacion, horas_hr_alta</code>. Fecha en formato AAAA-MM-DD. Si un día ya existe, se reemplaza.</p>
        <button className="btn" onClick=${() => csvRef.current.click()}>Importar CSV de clima</button>
        <h3 style=${{ marginTop: 16 }}>Generar datos simulados</h3>
        <div className="rejilla2"><label className="campo"><span>Desde</span><input className="inp" type="date" value=${cDesde} onChange=${e => setCDesde(e.target.value)} /></label>
          <label className="campo"><span>Hasta</span><input className="inp" type="date" value=${cHasta} onChange=${e => setCHasta(e.target.value)} /></label></div>
        <button className="btn" onClick=${simularClima}>Generar clima simulado</button>
      </div>
    </section>

    <section className="seccion"><h2>Datos</h2>
      <div className="fila-btn">
        <button className="btn" onClick=${cargarDemo}>Agregar datos de demostración</button>
        <button className="btn" onClick=${quitarDemo}>Quitar datos de demostración</button>
        <button className="btn" onClick=${respaldo}>Descargar respaldo JSON</button>
      </div>
      <p className="peq muted" style=${{ marginTop: 10 }}>El respaldo JSON contiene una lista por colección (tablas, usuarios, recorridos, evaluaciones con sus plantas y hojas, aplicaciones, clima). Es el formato que se cargará en la base de datos de producción.</p>
      <div className="caja-borde" style=${{ marginTop: 16, borderColor: 'var(--error)' }}>
        <h3>Reiniciar la app</h3>
        <p className="peq">Borra tablas, usuarios, recorridos, aplicaciones, clima y umbrales${st.sync.modo === 'servidor' ? ', en este dispositivo y en el almacén compartido del rancho' : ' de este dispositivo'}, y vuelve a la pantalla de configuración inicial para cargar otro KMZ. Descarga antes un respaldo si lo necesitas.</p>
        ${progreso ? html`<p style=${{ fontWeight: 700 }}>${progreso}</p>` : html`<button className="btn btn-xp" onClick=${reiniciar}>Reiniciar la app</button>`}
      </div>
    </section>

    <section className="seccion"><h2>Preaviso biológico</h2>
      <div className="info peq">Módulo pendiente. El modelo ya reserva el tipo de evaluación "preaviso" y las plantas marcadas con identificador persistente. Antes de implementarlo hay que definir con el agrónomo los coeficientes del estado evolutivo, la escala de densidad y los umbrales.</div>
    </section>
  </div>`;
}

/* ---------- App ---------- */
function App() {
  const st = useStore();
  const [tab, setTab] = usePref('tab', 'campo');
  const [uid, setUid] = usePref('usuario', null);
  const [tema, setTema] = usePref('tema', 'light');
  useEffect(() => { const f = () => { setTab('campo'); setUid(null); }; window.addEventListener('reinicio', f); return () => window.removeEventListener('reinicio', f); }, [setTab, setUid]);
  useEffect(() => { if (tema === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', tema); }, [tema]);
  const usuarios = vivos(st.datos.usuarios).filter(u => u.activo !== false).sort((a, b) => a.rol.localeCompare(b.rol) || a.nombre.localeCompare(b.nombre));
  const usuario = usuarios.find(u => u.id === uid) || usuarios[0];
  const esAdmin = usuario && usuario.rol === 'administrador';
  if (!st.cargado || !st.sync.listo) return html`<div className="cargando">Cargando datos…</div>`;
  if (!usuarios.length || !vivos(st.datos.tablas).length) return html`<${Bienvenida} /><${Dialogo} />`;
  const tabs = [['campo', 'Campo', Icono.campo], ['aplicaciones', 'Aplicaciones', Icono.app], ...(esAdmin ? [['tablero', 'Tablero', Icono.tablero], ['admin', 'Admin', Icono.admin]] : [])];
  const tabActiva = tabs.some(t => t[0] === tab) ? tab : 'campo';
  return html`<div>
    <header className="barra">
      <div className="marca"><span className="marca-hoja" aria-hidden="true"></span><span className="txt">Sigatoka negra</span></div>
      <select className="sel-usuario" value=${usuario.id} onChange=${e => setUid(e.target.value)} aria-label="Usuario (simulación de roles)">
        ${usuarios.map(u => html`<option key=${u.id} value=${u.id}>${u.nombre} (${u.rol === 'administrador' ? 'admin' : 'operador'})</option>`)}
      </select>
      <button className="pill btn-tema" onClick=${() => setTema(tema === 'light' ? 'dark' : tema === 'dark' ? 'auto' : 'light')} aria-label=${'Tema: ' + (tema === 'light' ? 'claro' : tema === 'dark' ? 'oscuro' : 'automático')} title="Cambiar tema">${tema === 'light' ? '☀' : tema === 'dark' ? '☾' : 'A'}</button>
      <${Conexion} />
    </header>
    <main className=${'contenido' + (tabActiva === 'tablero' ? ' ancho' : '')}>
      ${tabActiva === 'campo' && html`<${Campo} usuario=${usuario} />`}
      ${tabActiva === 'aplicaciones' && html`<${Aplicaciones} usuario=${usuario} />`}
      ${tabActiva === 'tablero' && html`<${Tablero} />`}
      ${tabActiva === 'admin' && html`<${Admin} usuario=${usuario} />`}
    </main>
    <nav className="nav">${tabs.map(([k, n, ic]) => html`<button key=${k} className=${tabActiva === k ? 'activo' : ''} onClick=${() => { setTab(k); window.scrollTo(0, 0); }} aria-current=${tabActiva === k ? 'page' : undefined}>${ic}${n}</button>`)}</nav>
    <${Toast} />
    <${Dialogo} />
  </div>`;
}

(async function arrancar() {
  if (!window.React || !window.ReactDOM || !window.htm) { document.getElementById('root').innerHTML = '<div class="cargando">No se pudieron cargar las librerías. Revisa tu conexión y recarga la página.</div>'; return; }
  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  await Store.cargar();
  Sync.iniciar();
})();
</script>
</body>
</html>
